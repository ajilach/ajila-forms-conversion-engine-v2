[net]
# Fetching the u2s git dependency, which only re-vendoring does, goes over SSH
# with your own git setup; cargo's built-in git client does not use it.
git-fetch-with-cli = true

# Builds take the u2s crates from vendor/crates and never fetch them. crates.io
# is not replaced.
[source."git+ssh://git@github.com/ajilach/ajila-forms-conversion-engine-v3.git?rev=656e84e0b39eeaf22e01cee2b01bad4b647c7dbe"]
git = "ssh://git@github.com/ajilach/ajila-forms-conversion-engine-v3.git"
rev = "656e84e0b39eeaf22e01cee2b01bad4b647c7dbe"
replace-with = "vendored-u2s"

[source.vendored-u2s]
directory = "vendor/crates"
