[package]
name = "blueprint-app"
version = "0.3.11"
edition.workspace = true
rust-version.workspace = true

# `unused_qualifications` is deliberately absent: every one of its hits in this
# crate comes from `rsx!` expansion, not from the source.
[lints.clippy]
# All four `#[allow]`s are gone; keep them from creeping back.
too_many_arguments = "deny"
ref_option = "warn"
needless_pass_by_value = "warn"
# Nursery lint, so warn rather than deny — it can false-positive.
redundant_clone = "warn"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
base64 = { workspace = true }
image = { workspace = true }
blueprint = { path = "../core" }
agent = { path = "../agent" }
pipeline = { path = "../pipeline" }
runner = { path = "../runner" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
dirs = { workspace = true }
reqwest = { workspace = true }
