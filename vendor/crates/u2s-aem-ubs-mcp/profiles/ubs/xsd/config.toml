# ═══════════════════════════════════════════════════════════════════════════════
# AEM → XSD walk
# ═══════════════════════════════════════════════════════════════════════════════
#
# The schema is derived from the AEM node tree, and each node's `bindRef` is
# assigned during the same walk, so the two agree by construction.
#
# Two rules below need no configuration and do most of the work:
#   • A plain layout panel adds no XSD level — its children bubble up. Only a
#     panel that repeats or that came from a fragment produces an element.
#   • `ref=` versus `name=`/`type=` is decided by looking the resolved element
#     name up among the global elements declared under `types/`.
#
# `maxOccursValue` is emitted for every repeating element regardless of the AEM
# node's real `maxOccur`, which is what UBS's own schemas do.

# Default XSD type per AEM component kind, used when neither an [elements]
# synonym nor an [[aemElements]] rule supplies one.
[defaultTypes]
textbox = "xs:string"
radiobutton = "xs:string"
checkbox = "xs:string"
dropdownlist = "xs:string"
numericbox = "xs:decimal"
datepicker = "xs:date"

# ─── Rules, in order — first match wins ───────────────────────────────────────
#
# Match keys (all optional, ANDed): kind, fragRef (substring), name / names,
# title / titles (case-insensitive), options (set equality ignoring order, case,
# numeric prefixes and markup), visible.
# Actions: ignore, element, type, occurs ("none" | "optional" | "optionalRepeating").
#
# `element` is used verbatim, so an already-camel-cased name survives.

# --- Nodes that carry no form data -------------------------------------------

# Form metadata and the internal-bank-use block are presentation only.
[[aemElements]]
kind = "fragment"
fragRef = "afforms_global_fragmentlib/formmetadata"
ignore = true

[[aemElements]]
kind = "fragment"
fragRef = "affrg_global_InternalBankUse"
ignore = true

# Hidden bookkeeping text boxes: counters, the form code, the DoR header slots.
[[aemElements]]
kind = "textbox"
visible = false
ignore = true

# --- Fragments ---------------------------------------------------------------

# BankingRelationship is declared globally, so it is referenced, and it is the
# one element UBS emits with no occurrence attributes at all.
[[aemElements]]
kind = "fragment"
fragRef = "affrg_BankingRelationship1"
element = "BankingRelationship"
occurs = "none"

# Two panels share affrg_SignatureGeneric1 and only the title tells them apart.
# Neither name is a global element in Signature.xsd, so both are emitted as
# name=/type=. The titled rules must precede the untitled fallback.
[[aemElements]]
kind = "fragment"
fragRef = "affrg_SignatureGeneric1"
titles = ["Client", "Kunde", "Cliente", "Titular"]
element = "AccountHolderSignature"
type = "SignatureType"

[[aemElements]]
kind = "fragment"
fragRef = "affrg_SignatureGeneric1"
titles = [
    "Authorized representative",
    "Authorised representative",
    "Bevollmächtigter",
    "Rappresentante autorizzato",
]
element = "AuthRepSignature"
type = "SignatureType"


# --- UBS fragment element table -------------------------------------------
#
# Ported from `fragmentElementNames.js` in UBS's af-xsd-automation. A fragment
# carries only its `fragmentModelRoot` (a *type*), and several global elements
# can share one type, so which element a fragment becomes is a per-usage
# decision the type library cannot answer. UBS keeps this table; we keep the
# same knowledge as rules.
#
# `type` is given only where the element is NOT declared globally under
# types/ — supplying it forces `name=`/`type=`, and a global element must be
# emitted as `ref=`. Where it is omitted the fragment's own model root
# supplies the type.
#
# Two of UBS's 37 entries are deliberately absent: affrg_cc_IndividualAddress1
# and affrg_cc_SignatureGeneric1 map to a slash-separated *list* of candidate
# elements (CardMailingAddress/CardInvoiceAddress/...), i.e. the choice depends
# on context that the table cannot express. UBS's own generator emits the
# literal list as one name; add a `title`-qualified rule instead when a form
# needs them.

