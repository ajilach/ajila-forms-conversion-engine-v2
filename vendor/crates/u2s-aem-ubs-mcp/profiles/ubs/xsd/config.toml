# XSD Output Profile Configuration
#
# The schema is derived from the AEM node tree, and each node's bindRef is
# assigned during the same walk, so a form and its schema agree by construction.
# See the "AEM -> XSD walk" section at the end of this file for the shape rules.
#
# Element names come from three places, in order of precedence:
#
#   1. [[aemElements]]      — an explicit rule (see that section)
#   2. [elements.<name>]    — a field label equal to one of `synonyms`
#      [sections.<name>]    — a page-panel title matching one of `patterns`
#   3. the label or title itself, PascalCased
#
# [elements.<name>]       — field → xs:element name + type
#   synonyms              — the WHOLE label must equal one of these
#                           (case-insensitive, trimmed)
#   type                  — XSD type (e.g. "xs:string", "xs:decimal", "xs:date")
#
#   Matching is on the whole label deliberately. These forms use sentences as
#   labels and the table holds two-letter synonyms, so substring matching turned
#   "UNKNOWN" into StreetNumber (it contains "No") and any label mentioning a
#   date into xs:date. Whole-label matching keeps the real wins — Straße/Via ->
#   Street, Cognome -> LastName, Data -> Date/xs:date — and misfires on nothing.
#   A near-miss such as "Telefon Mobil" is fixed by adding that exact string.
#
#   NOTE: compute_bind_refs, which feeds fragment matching, still matches these
#   synonyms as substrings. Those paths never reach the emitted schema.
#
# [sections.<name>]       — page-panel title → xs:element name
#   patterns              — regexes, matched case-insensitively
#
# All *.xsd files in the types/ subdirectory are automatically indexed.
# An <xs:include> directive is emitted for every indexed file that declares a
# type actually referenced by the generated schema. Those same files decide
# `ref=` versus `name=`/`type=`: a name declared as a global element there is
# referenced, never re-declared.
#
# Complex types are also parsed into a registry (resolving xs:extension
# inheritance and xs:element ref) which fragment matching uses.
#
# schemaLocationPrefix — prefix prepended to the relative path of each types/
#   file when constructing the schemaLocation attribute (default: "../")

schemaLocationPrefix = "../"

# rootElementPrefix: the XSD root element is this prefix followed by the
# form code (UBSAF_AABF). Fragments' bindRef paths use the same root.
rootElementPrefix = "UBSAF_"

masterLanguage = "en"

# `maxOccursValue` is emitted for every repeating element in the AEM -> XSD walk,
# regardless of the AEM node's real `maxOccur`, matching UBS's own schemas.
maxOccursValue = 50

# The simple-element library is always included, referenced or not.
alwaysInclude = ["../AFSimpleTypeElements/AFSimpleElements.xsd"]

# Whether a titled page panel (an H2 section) produces its own XSD level.
#
# UBS's own rule is that a panel contributes a level only if it repeats or came
# from a fragment, which makes their schemas flat. Set `false` to follow that
# exactly. It is `true` here because our generated forms are far denser: on
# AAGZ_019, flattening pushes 63 of 89 elements onto ordinal suffixes instead of
# 34 — including AccountHolderSignature2 through AccountHolderSignature21 — and
# makes every name depend on document order, so inserting a field near the top
# renames elements far below it.
#
# Neither setting avoids suffixes entirely; forms with repeated section titles
# still collide. The real fix for a specific form is an [[aemElements]] rule
# giving the section or repeatable a semantic name, which is how UBS's own
# reference schemas end up with no suffixes at all.
groupPagePanels = true

# ─── Elements ──────────────────────────────────────────────────────────────────

# --- Name fields ---

[elements.LastName]
synonyms = ["Last Name", "Nachname", "Cognome", "Apellido(s)",]
type = "xs:string"

[elements.FirstName]
synonyms = ["First Name(s)", "Vorname(n)", "Nome(i)", "Nombre(s)", "Vorname"]
type = "xs:string"

[elements.Name]
synonyms = ["Name", "Nome", "Nombre", "Nome della società", "Name des Kunden", "Name of client", "Nome del cliente"]
type = "xs:string"

[elements.Company]
synonyms = ["Company", "Firma", "Società"]
type = "xs:string"

# Per-type element aliases. Label resolution is context-free -- one element
# name per label -- but a word can mean different things in different blocks.
# `Ort` / `Località` resolve to `Place`, which is right in a signature row
# (SignatureType.Place) and wrong for the city of an address; `N.` resolves to
# a bare `N`, which is in no type at all. Without these an Italian address
# matches no type, so `affrg_AddressGeneric1` can never be selected for it.
# Consulted only while AddressType itself is being tested, so SignatureType and
# every other type keep the default resolution.
[typeAliases.AddressType]
Place = "City"
N = "StreetNumber"

# --- Address fields ---

[elements.Street]
synonyms = ["Street", "Straße", "Strasse/Nr.", "Via", "Calle"]
type = "xs:string"

[elements.PostalCode]
