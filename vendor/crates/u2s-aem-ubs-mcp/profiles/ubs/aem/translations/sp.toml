# Spanish translations
# Key = master text (English), Value = Spanish translation

[translations]
"Back" = "Atrás"
"Next" = "Siguiente"
"Submit" = "Enviar"
"Preview" = "Vista previa"
"Save Progress" = "Guardar progreso"
"Add" = "Añadir"
"Submission failed" = "Error en el envío"
"<p>The form could not be sent. Please try again later.</p>" = "<p>No se pudo enviar el formulario. Por favor, inténtelo de nuevo más tarde.</p>"
"Thank you for submitting the form." = "Gracias por enviar el formulario."
"<p>By clicking on \"Preview\", you can review your document before submission.</p><p>After clicking \"Submit\", you will no longer be able to edit the document and the PDF will be created for signing.</p>" = "<p>Al hacer clic en \"Vista previa\", puede revisar su documento antes del envío.</p><p>Después de hacer clic en \"Enviar\", ya no podrá editar el documento y se creará el PDF para su firma.</p>"
"Summary of form information" = "Resumen de la información del formulario"
"Summary" = "Resumen"

# Custom elements
"For internal bank use only" = "Solo para uso interno del banco"
# The `signatures` template's own title (AABF_019's wording).
"Signature(s)" = "Firma(s)"
"Signature(s) verified / Signed in my presence" = "Firma(s) comprobada(s) / Firmado en mi presencia"
"Company" = "Empresa"

# Email / telephone validation messages (feedback #117). The key is the English
# master the `email`/`telephone` templates write into
# `validatePictureClauseMessage`; AEM resolves it through this dictionary, so the
# reader sees the message in their own language. Wordings are the ones already
# deployed in the corpus, adopted verbatim so the same sentence does not ship in
# two variants.
"Please enter a valid email address (e.g., max.muster@beispiel.ch)." = "Por favor, introduzca una dirección de correo electrónico válida (por ejemplo, max.muster@beispiel.ch)."
"Please enter a valid phone number incl. country code (e.g., +41)." = "Por favor, introduzca un número de teléfono válido que incluya el código de país (por ejemplo, +41)."
