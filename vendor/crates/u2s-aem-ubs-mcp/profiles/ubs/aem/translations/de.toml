# German translations
# Key = master text (English), Value = German translation

# A quotation is written «…»: the package prints it with the quotation marks of the
# form's language and entity country (src/aem/quotes.rs).

[translations]
"Back" = "Zurück"
"Next" = "Weiter"
"Submit" = "Absenden"
"Preview" = "Vorschau"
"Save Progress" = "Fortschritt speichern"
"Add" = "Hinzufügen"
"Submission failed" = "Übermittlung fehlgeschlagen"
"<p>The form could not be sent. Please try again later.</p>" = "<p>Das Formular konnte nicht gesendet werden. Bitte versuchen Sie es später erneut.</p>"
"Thank you for submitting the form." = "Vielen Dank für das Einreichen des Formulars."
"<p>By clicking on \"Preview\", you can review your document before submission.</p><p>After clicking \"Submit\", you will no longer be able to edit the document and the PDF will be created for signing.</p>" = "<p>Durch Klicken auf «Vorschau» können Sie Ihr Dokument vor dem Absenden überprüfen.</p><p>Nach dem Klicken auf «Absenden» können Sie das Dokument nicht mehr bearbeiten und das PDF wird zur Unterschrift erstellt.</p>"
"Summary of form information" = "Zusammenfassung der Formulardaten"
"Summary" = "Zusammenfassung"

# Custom elements
"For internal bank use only" = "Nur für den internen Bankgebrauch"
# The `signatures` template's own title (AABF_019's wording).
"Signature(s)" = "Unterschrift(en)"
"Signature(s) verified / Signed in my presence" = "Unterschrift(en) geprüft / in meiner Gegenwart unterzeichnet"
"Company" = "Firma"

# Email / telephone validation messages (feedback #117). The key is the English
# master the `email`/`telephone` templates write into
# `validatePictureClauseMessage`; AEM resolves it through this dictionary, so the
# reader sees the message in their own language. Wordings are the ones already
# deployed in the corpus, adopted verbatim so the same sentence does not ship in
# two variants.
"Please enter a valid email address (e.g., max.muster@beispiel.ch)." = "Bitte geben Sie eine gültige E-Mail-Adresse ein (z. B. max.muster@beispiel.ch)."
"Please enter a valid phone number incl. country code (e.g., +41)." = "Bitte geben Sie eine gültige Telefonnummer einschließlich Ländervorwahl (z. B. +41) ein."

# The letterhead component's own texts (`letterhead.xml`): its section
# headings, as the rich text they are written as, and the labels of the
# fields a person fills in. Shipped only with a form that holds a letterhead.
# Corpus wordings where the issued letters have one.
