"<p><b>Letter content</b></p>" = "<p><b>Briefinhalt</b></p>"
"Individual" = "Privatperson"
"Company/Entity" = "Firma/Rechtseinheit"
"Last name" = "Nachname"
"First name(s)" = "Vorname(n)"
"Company/Entity name" = "Firmenname"
