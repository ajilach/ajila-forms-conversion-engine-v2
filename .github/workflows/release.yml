name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check for version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          # For workflow_run, checkout the commit from the test workflow
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify commit was tested
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # For workflow_run trigger, check that the triggering workflow succeeded
          if [ "${{ github.event_name }}" == "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Test workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }})"
            exit 1
          fi
          # Also verify the tested tag exists
          if ! git tag --list "tested-${COMMIT_SHA}" | grep -q .; then
            echo "::error::Commit ${COMMIT_SHA} has not been tested. Waiting for test workflow to complete."
            exit 1
          fi
          echo "Commit ${COMMIT_SHA} has passed tests."

      - name: Compare Cargo.toml version to latest release
        id: check
        run: |
          VERSION=$(grep '^version' app/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "app/Cargo.toml version: $VERSION"

          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          echo "Latest release tag: $LATEST_TAG"

          if [ "v$VERSION" != "$LATEST_TAG" ]; then
            echo "Version changed — will release v$VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged — skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create Release
    needs: [check-version]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.check-version.outputs.version }}
          git push origin v${{ needs.check-version.outputs.version }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          release_name: Release v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false

  build-and-upload:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            package_types: macos
            artifact: blueprint-macos-aarch64.dmg
            content_type: application/x-apple-diskimage
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_types: deb
            artifact: blueprint-linux-x86_64.deb
            content_type: application/vnd.debian.binary-package
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_types: nsis
            artifact: blueprint-windows-x86_64-setup.exe
            content_type: application/octet-stream

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI
        run: |
          DX_VERSION="v0.7.9"
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-pc-windows-msvc.zip -o dx.zip
            unzip dx.zip
            mv dx.exe C:/Windows/System32/
          fi
        shell: bash

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        # Installed directly with apt rather than through a caching action. These
        # are the GTK/WebKit system libs blueprint-app links against, and a cache
        # layer in front of them is a liability: a stale/incompatible cache entry
        # restores zero packages, still reports success, and the failure only
        # surfaces ~10 minutes later as an opaque `dx bundle` error. ~30s of apt
        # against an 11-minute build is not worth that trade.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev
        shell: bash

      - name: Verify Linux dependencies are usable
        if: matrix.os == 'ubuntu-latest'
        # Guard rail: assert the -sys build scripts can actually find their system
        # libs, so a broken environment fails here in seconds with a readable
        # message instead of inside `dx bundle`, which swallows cargo's stderr.
        run: |
          missing=0
          for lib in glib-2.0 gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1; do
            if pkg-config --exists "$lib"; then
              echo "ok: $lib $(pkg-config --modversion "$lib")"
            else
              echo "::error::pkg-config cannot find '$lib' — GTK/WebKit dev packages are not installed"
              pkg-config --print-errors "$lib" || true
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        shell: bash

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch pdfium
        # The u2s PDF renderer loads pdfium dynamically from next to the
        # executable; the script pins the release and checks its SHA-256.
        run: ./scripts/fetch-pdfium.sh
        shell: bash

      - name: Build and stage the sidecars
        # The binaries the app ships next to its executable (mcp, the rule
        # worker, pdfium), staged where [bundle].external_bin in app/Dioxus.toml
        # expects them. The same script stages them for a local build.
        run: ./scripts/stage-sidecars.sh ${{ matrix.target }}
        shell: bash

      - name: Bundle with Dioxus CLI
        # dx bundle (unlike dx build) does platform packaging and embeds the app
        # icon from [bundle] icon in Dioxus.toml — the .icns into the macOS .app,
        # the .ico into the Windows installer/exe, and a .desktop + icon into the
        # Linux .deb. No manual icon handling needed.
        #
        # --verbose streams the underlying cargo output. Without it dx collapses a
        # compile failure to "cargo build finished with errors" and discards the
        # actual rustc/build-script diagnostics, which makes CI failures here
        # undebuggable from the logs alone.
        run: dx bundle --verbose --release --platform desktop --package blueprint-app --package-types ${{ matrix.package_types }}
        shell: bash

      - name: Sign macOS app (ad-hoc)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Ad-hoc sign the bundled .app to prevent the "damaged" Gatekeeper message.
          APP=$(find target/dx/blueprint-app/bundle -ipath '*macos*' -name '*.app' | head -1)
          codesign --force --deep --sign - "$APP"
        shell: bash

      - name: Prepare artifact
        run: |
          mkdir -p release-artifacts
          if [[ "${{ matrix.os }}" == macos* ]]; then
            # Build a drag-to-Applications .dmg from the signed .app.
            APP=$(find target/dx/blueprint-app/bundle -ipath '*macos*' -name '*.app' | head -1)
            STAGING=$(mktemp -d)
            cp -R "$APP" "$STAGING/"
            ln -s /Applications "$STAGING/Applications"
            hdiutil create -volname "Blueprint" -srcfolder "$STAGING" -ov -format UDZO \
              "release-artifacts/${{ matrix.artifact }}"
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            cp "$(find target/dx/blueprint-app/bundle -ipath '*deb*' -name '*.deb' | head -1)" "release-artifacts/${{ matrix.artifact }}"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp "$(find target/dx/blueprint-app/bundle -ipath '*nsis*' -name '*.exe' | head -1)" "release-artifacts/${{ matrix.artifact }}"
          fi
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.artifact }}
          asset_name: ${{ matrix.artifact }}
          asset_content_type: ${{ matrix.content_type }}

  build-and-upload-cli:
    name: Build CLI ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: blueprint-cli-macos-aarch64.tar.gz
            content_type: application/gzip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: blueprint-cli-linux-x86_64.tar.gz
            content_type: application/gzip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: blueprint-cli-windows-x86_64.zip
            content_type: application/zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch pdfium
        # Shipped next to the binary: the u2s PDF renderer loads it from there.
        run: ./scripts/fetch-pdfium.sh
        shell: bash

      - name: Build blueprint-cli
        # The rule worker ships next to the binary: every rule a run checks runs
        # in it, and a run whose rules cannot run is refused.
        run: |
          cargo build --release -p blueprint-cli --target ${{ matrix.target }}
          cargo build --release -p u2s-rules-host --bin u2s-rules-worker --target ${{ matrix.target }}
        shell: bash

      - name: Package artifact
        run: |
          mkdir -p release-artifacts
          OUT="target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp vendor/pdfium/lib/pdfium.dll "$OUT/"
            7z a "release-artifacts/${{ matrix.artifact }}" "./$OUT/blueprint.exe" "./$OUT/u2s-rules-worker.exe" "./$OUT/pdfium.dll"
          else
            chmod +x "$OUT/blueprint" "$OUT/u2s-rules-worker"
            cp vendor/pdfium/lib/libpdfium.* "$OUT/"
            tar -czf "release-artifacts/${{ matrix.artifact }}" -C "$OUT" blueprint u2s-rules-worker $(cd "$OUT" && ls libpdfium.*)
          fi
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.artifact }}
          asset_name: ${{ matrix.artifact }}
          asset_content_type: ${{ matrix.content_type }}
