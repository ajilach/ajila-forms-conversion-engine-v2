name: Test

on:
  push:
    branches: [ "master", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    # Pinned rather than relying on whatever ubuntu-latest ships: this is an
    # edition-2024 workspace, and release.yml already pins the same way.
    - uses: dtolnay/rust-toolchain@stable
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    # blueprint-app links against GTK/WebKit, so the runner needs them before
    # the workspace will build. Same package set release.yml installs.
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libxdo-dev

    # agent/build.rs downloads the pinned pdfium into vendor/pdfium; the cache
    # only spares the download.
    - name: Cache pdfium
      uses: actions/cache@v4
      with:
        path: vendor/pdfium
        key: pdfium-linux-x64-${{ hashFiles('agent/build.rs') }}

    # --locked so CI resolves exactly what Cargo.lock pins; without it a silently
    # different dependency set can pass here and fail for everyone else.
    - name: Build
      run: cargo build --verbose --release --locked --workspace
    - name: Run tests
      run: cargo test --verbose --release --locked --workspace

    - name: Tag commit as tested
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f "tested-${{ github.sha }}"
        git push origin "tested-${{ github.sha }}" --force
