id = "ubs-redacto-no-untranslated-stubs"
title = "A non-master language carries its own wording, not a copy of the master"
output_formats = ["redacto-ubs"]
description = """
A non-master language whose text merely repeats the master-language text is an untranslated stub,
not a translation: the reader of that language sees another language's text. The master language is
English when the document ships it, otherwise the first language of `/sources`. Each language's text
comes from that language's own PDF.

Exempt is a text that is identical in the source in every language (a number, a proper noun, a code,
a form code).

How to judge: list the assets whose non-master content equals the master content (read `/assets`
with json_get, or json_search for the master wording and compare the sibling language keys) and
confirm each against that language's PDF with xfa_search or xfa_page_text. An asset that the source
also writes identically in that language passes.

A break is an asset whose non-master content equals the master content although the source's own
wording in that language differs.

Fix: write the source's wording for that language in the asset's `content`.
"""

[judge]
pointers = ["/sources", "/assets"]
