id = "ubs-redacto-tables-are-html-tables"
title = "A source table is one asset holding a real table"
output_formats = ["redacto-ubs"]
description = """
A grid of aligned rows is a table even when only some rules are drawn, even with a single column,
and even when one of its columns is empty on every row. One table is ONE asset holding a real
`<table>`, its header cells in `<thead>` and one `<tr>` per row. A run of consecutive one-line
paragraphs where the page shows a ruled grid is a table authored as paragraphs, and a header row
drawn without rules is not a set of separate headings.

How to judge: render the source pages (xfa_render_pages) and find every region that is a table. For
each, find its asset (json_search for a cell's text) and check that its markup has the header row in
`<thead>`, one `<tr>` per source row and the source's columns, in every language. Then look at every
run of consecutive paragraph assets in `/assets` and `/body` and check the page: a run that the page
shows as a grid is a missed table.

A break is a table region that is not one asset with a real table, a run of paragraph assets
standing for a table, or a table that lacks rows, columns or a header the page shows.

Fix: replace the paragraph assets with one asset of table HTML in every language, and its place in
`/body`.
"""
