# The Redacto model refuses both halves when the dump is built (`validate` in
# `u2s-redacto/src/model/validate.rs`); this rule gives the same feedback on every edit, in one list.
id = "ubs-redacto-assets-carry-every-language"
title = "Every asset is written in every language of the document"
output_formats = ["redacto-ubs"]
description = """
`sources` has one entry per delivered language, and its keys are the document's languages. Each
asset's `content` is an HTML fragment per language, for example
`{"de": "<h2>...</h2>", "en": "<h2>...</h2>"}`. Every text asset must carry an entry for every
language of `sources`, non-blank, and no other key: the platform fails to render an asset that
lacks a language, and refuses a language the document does not declare. An `image` asset is exempt:
its `content` is a `data:` URI, typically a single `zxx` entry.

Reported: a language of `sources` that a text asset has no entry for (pointer `/assets/<i>/content`),
a blank entry (pointer `/assets/<i>/content/<language>`), and a key that is not one of the
`sources` languages (the same pointer).

Add the missing entry with the source's wording for that language: read that language's PDF
(xfa_page_text, xfa_search) and pair the text by meaning and layout position; never copy another
language's text into it. Delete a key that is not in `sources`, or add the language to `sources` (with
its `variables` and `header`) if the source has it.
"""
