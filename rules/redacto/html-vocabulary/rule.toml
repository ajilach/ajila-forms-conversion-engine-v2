# Mirrors `check_well_formed` and `check_img_alt` of `u2s-redacto/src/model/validate.rs`, which
# refuse the same HTML when the dump is built; keep the tag list in step with `ALLOWED_TAGS` there.
id = "ubs-redacto-html-vocabulary"
title = "Asset HTML stays in the Quill vocabulary, every tag closed, images with alt text"
output_formats = ["redacto-ubs"]
description = """
A Redacto document is text only. The HTML of a text asset is the platform's Quill vocabulary: `p`,
`h1` to `h6`, `strong`, `em`, `u`, `sup`, `sub`, `ul`, `ol`, `li`, `table`, `thead`, `tbody`,
`tr`, `th`, `td`, `a`, `span`, `br`, `div` and `img`; every tag closed; an `<img>` with a
non-blank `alt` text. Anything else (a `<script>`, `<input>`, `<form>`, `<style>`, `<font>`, `<b>`,
`<i>`, or an unclosed or wrongly nested tag) is refused by the platform or rendered wrongly: use
`strong` for bold, `em` for italic and `sup` for a footnote marker. If the source has input fields,
say so in the summary instead of inventing a representation.

Reported, per language of a text asset (pointer `/assets/<i>/content/<language>`): a tag outside the
vocabulary, a closing tag that does not match the tag open, a tag left open, and an `<img>` without
an `alt` attribute (in double quotes) that has text.

Replace the offending tag with its vocabulary equivalent, close the tag, or add the `alt`
attribute to the image.
"""
