id = "ubs-redacto-heading-levels-and-inline"
title = "Headings keep their source level, and inline marks stay inline"
output_formats = ["redacto-ubs"]
description = """
Headings keep their source level (`h1` to `h6`: the largest title of the source is `h1`, its
sections `h2`, and so on as the page shows them), and inline emphasis (`strong`, `em`, `u`) and
footnote markers (`sup`) stay inline in their text instead of becoming a block or a separate asset.

How to judge: render the source pages (xfa_render_pages) and compare the heading level of each
heading, and each bold, italic, underlined or superscript run, with the document's assets
(json_search for the heading's text and read the tag around it).

A break is a heading at another level than the page shows (an `h3` for a main title, a paragraph
with bold text where the page has a heading) or emphasis or a footnote marker that is lost or turned
into its own block.

Fix: replace the tag with the level the page shows, and put the emphasis or marker back inline.
"""
