id = "ubs-redacto-layout-panels"
title = "Columns and footnotes are styled panels, everything else a plain container"
output_formats = ["redacto-ubs"]
description = """
A region the source lays out as two balanced columns is a `styledPanel` with style `layout-split`
around its components; a side-by-side grid of blocks is a `styledPanel` with style
`layout-split-block`; the footnotes are a `styledPanel` with style `footnote`. Everything else is a plain
`assetContainer`. A document whose source has columns or footnotes and whose body has no such panel
has been flattened.

How to judge: render the source pages (xfa_render_pages) and compare them with `/body`
(json_get): find each region that the page shows in columns, in a side-by-side grid or as footnotes at
the foot of the text, and check that its components sit inside a
`styledPanel` of the matching style. Check the reverse too: a `styledPanel` that wraps a region the
page shows as one column of plain text.

A break is a column, grid or footnote region that is not in the matching `styledPanel`,
or a styled panel around a region that does not have that layout.

Fix: json_patch `/body`, wrapping the region's components in a `styledPanel` of the right style (or
unwrapping a panel that has no counterpart on the page).
"""
