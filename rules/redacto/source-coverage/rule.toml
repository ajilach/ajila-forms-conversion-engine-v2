id = "ubs-redacto-source-coverage"
title = "Nothing the source says is missing"
output_formats = ["redacto-ubs"]
description = """
Every heading, paragraph, list item, table cell and footnote of each language's PDF reached the
document in that language, and no text is present in only one language when the source has several.

How to judge: walk each language's PDF with xfa_page_text, page by page, against the document
(json_outline, json_get, json_search) and confirm that every piece of text of the page is in an
asset, in that language, in the place the page shows it. Include what appears only in a variant of
the source (xfa_open with xfa_set) when the source has configurator choices that show text.

A break is a source text, in any language, that no asset carries, or a text carried in one language
only although the source has it in several.

Fix: add the missing text as an asset, in every language, at the place the page shows it (`add` the
asset to `/assets/-` and its place to `/body`).
"""

[judge]
# Walks every page of the source in every language.
max_turns = 16
