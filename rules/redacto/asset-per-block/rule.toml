id = "ubs-redacto-asset-per-block"
title = "One asset per block of text"
output_formats = ["redacto-ubs"]
description = """
One asset holds one block of text: a heading, a paragraph, a list, a table, a footnote. Consecutive
blocks can share one `assetContainer` in `/body`, but each stays its own asset, so that a block can be
found, reordered and compared with the source on its own.

How to judge: read `/assets` (json_outline, json_get) for an asset whose content holds several
blocks (a heading followed by a paragraph, two paragraphs, a paragraph followed by a list) where the
source page shows separate ones (xfa_render_pages). A single block with inline markup, a list with
its items and a table with its rows are one block each and pass.

A break is an asset that holds more than one block of the source.

Fix: split the asset into one asset per block, in every language, and reference them in order from
the same `assetContainer`.
"""
