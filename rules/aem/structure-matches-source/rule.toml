id = "ubs-aem-structure-matches-source"
title = "The tree has the structure of the source pages"
output_formats = ["aem-ubs"]
description = """
For each region of each source page, decide from the PAGE what it is (a table, a list, a
panel, a heading at some level, a repeatable) and confirm the tree says the
same: section order, grouping, heading levels, field layout and overall appearance. No tool checks
this: a table whose cells were authored as loose text carries the same text as the table, so only a
comparison with the page catches it. Where the tree and the page disagree, the PAGE wins.

How to judge: render each source page (xfa_render_pages; xfa_set first for a conditional page) and
walk the tree section by section (json_outline, json_get). Check the order of the sections, which
fields share a row (`colspan`), which texts are headings and at what level (`heading_level` of a
TitleDraw, `title` of a page), where a group opens and closes, and where a repeatable is.

Heading levels follow what the page draws. Level 2 (a page's `title`, or a level-2 `TitleDraw`)
prints in the Document of Record with a rule above it, so it is only for a heading the source draws
with a rule line above it. A heading without one is level 3 or deeper, by its nesting. Bold text
that does not open a section is not a heading at all: a "Please note:" lead-in, a label in front
of a value. Write it as `<b>` inside a `TextDraw`'s paragraph. The line under the form's title is
the first page's `title`, which the writer prints as the subtitle, not as a step heading; it is
never also a draw. Any other page takes as its `title` the heading it opens with, ruled in the
source or not (ubs-aem-step-titles): a page never opens with a `TitleDraw`. A page that opens with
body text has no `title` (most steps of the reference forms have none), and its headings are
`TitleDraw`s at level 3 or deeper.

A letter (a source whose FIRST page has a letter top, ubs-aem-letter-detection) prints no form title and no step heading at its top: its letter
top is the `Letterhead`, its subject line the letterhead's `subject`, and the salutation, the body
paragraphs, the closing formula, the entity line and the attachments line follow as body text in
the source's order, with bold only where the source sets it. Its first page has no `title` unless
the source heads a section below the letter top. A section the source rules further down (a receipt
for the heir, a declaration) is a page or a TitleDraw as anywhere else. A field the source's master page prints in the page header beside the banking relationship (a
custody account number, "N. di conto") comes after the `Letterhead` in a letter, which always opens
the first page after the `Preface` (ubs-aem-letter-letterhead, decision 2026-10-14); that order is not
a break. A letter top on a LATER page of
a form whose first page is not one (a mixed form: an order or internal notes first, the letter after)
is no letter: its receiver lines, date, subject and body are ordinary nodes in the source's order
(draws, inputs, a bold subject draw), never a `Letterhead`, and that is not a break.

A break is a region whose structure in the tree differs from the page: sections in another order,
a heading at another level, a level-2 heading the source does not rule (other than a page's
`title`), fields grouped differently,
a list or table flattened into plain paragraphs, or a repeated block authored once or as copies.

Fix: json_patch the tree to match the page. Tables are covered by the
ubs-aem-tables-are-html-tables rule. Two arrangements of the page the tree does not copy: text the
page sets in columns is one column, because AEM has no multi-column text
(ubs-aem-single-column-text); and in an addressee-driven form the parties sit in the
configurator's option panels and the signatures on the signature page, wherever the source places
them (ubs-aem-account-holder-cluster). Neither is a break.
"""

[judge]
# Walks every page of the source in every language.
max_turns = 80
