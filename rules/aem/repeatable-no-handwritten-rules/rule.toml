# The archetype is `Lower::repeatable` of the UBS writer (`lower.rs`) with the button rules of
# `scripts::Repeating`; an unbounded `max_occur` (u32::MAX, what a loaded `maxOccur="-1"` becomes)
# is written as `maxOccur="-1"`, which the backlog's "Unbounded repeatables" row replaces with 20.
id = "ubs-aem-repeatable-no-handwritten-rules"
title = "Repeatables keep the template's archetype"
output_formats = ["aem-ubs"]
description = """
The template writes every repeatable as one archetype (backlog "Repeatables (V2)"): the Add and
Remove buttons with their six rules (each addresses the panel relatively and drives it through
`window.forms.ubs.addInstance` and `removeInstance`, never `instanceManager`), the panel properties
the UBS client library reads (`dorFieldStyling="Repeating Panel Numbering"`, `headingLevel`), the
row numbering (shown from two rows on) and the Add label. None of it is authored: write no add or
remove rule, and keep none a loaded package had (a rule that calls `instanceManager` bypasses the UBS
routines).

Reported:

- a script in a node's `passthrough` that calls `instanceManager` and is not the template's own
  (those say `Generated automatically` and carry `_archetype`): delete the entry;
- a Repeatable whose `max_occur` is below `min_occur`, or 0: set the source's bounds
  (ubs-aem-repeatable-bounds);
- a Repeatable left unbounded (`max_occur` 4294967295, a loaded `maxOccur="-1"`): an unbounded
  section takes at most 20 rows. The fix sets `max_occur` to 20.
"""
