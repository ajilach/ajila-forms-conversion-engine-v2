id = "ubs-aem-repeatable-no-handwritten-rules"
title = "Repeatables carry the template's Add and Remove, not rules of the author's"
output_formats = ["aem-ubs"]
description = """
A repeatable carries a fixed archetype that the template writes: the Add and Remove buttons, all
six of their rules (each one addresses the panel relatively and drives it through
`window.forms.ubs.addInstance` and `removeInstance`, never through `instanceManager`) and the
panel properties the UBS client library reads (`dorFieldStyling="Repeating Panel Numbering"`,
`headingLevel`). Do not hand-author add or remove rules, and do not keep one that a loaded package
carried: a rule that calls `instanceManager` bypasses the UBS routines.

Reported: any script in a node's `passthrough` (`raw_attributes` or
`raw_children`) that calls `instanceManager` and is not one of the template's own generated
scripts (those say `Generated automatically` and carry `_archetype`).

Delete the offending entry from the node's `passthrough`; the template writes the working rules.
"""
