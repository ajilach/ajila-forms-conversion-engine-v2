# Mirrors `collect_panel_visibility` and the panel context of the UBS writer (`xml_writer.rs`):
# a conditional panel is written with its visibility hook only when it is `is_conditional`.
id = "ubs-aem-condition-targets"
title = "A condition targets a conditional Panel"
output_formats = ["aem-ubs"]
description = """
Behaviour comes from the source's branches (CNV-SRC-7). What a source choice shows or hides
(in a session: `xfa_open`, then `xfa_set` or `xfa_click` on each of its values, whose result lists
what `appeared` and `disappeared`, with `xfa_reset` between values; a combination of choices set one
after another reveals a section only the combination shows) is a
`ConditionRule` on the Dropdown, Checkbox or RadioButton (`conditions`: `target_panel_name`,
`value`, `show`), which shows or hides a Panel by its `name`. Two things are required, and one
without the other silently fails: the rule on the trigger, AND `is_conditional: true` on the
target Panel. Only a conditional Panel is written with the visibility hook (a Visibility script
plus an Initialize twin calling `window.forms.ubs.showAFShowDor` and `hideAFHideDor`, which show
and hide the panel in the form and the Document of Record together); a Panel left
`is_conditional: false` gets no hook, so authoring it `visible: false` and pointing a condition at
it yields a panel that is invisible forever (and a repeatable inside it renders one instance). A
field, a text or a repeatable that the source shows or hides is wrapped in a conditional Panel.
Renaming a panel without renaming the conditions that name it leaves a rule that looks right in
the editor and never fires. A choice that locks rather than hides inputs or a section uses
`enable_conditions`, not a condition (ubs-aem-conditional-access).

Reported:

- a `target_panel_name` that is not the name of exactly one node of the form, or of a node that is
  not a Panel;
- a target Panel that holds the trigger itself: hidden once, the choice can never bring it back;
- a target Panel that is not `is_conditional` (pointer: that Panel's `is_conditional`).

That a condition's `value` is one of the trigger's option values is checked by
ubs-aem-options-wellformed. A hidden Panel that no condition targets (hidden metadata, an
always-in-PDF panel) is fine.

Set `is_conditional: true` on the target Panel; correct `target_panel_name` to the Panel's current
`name` (or rename the Panel back); if the target is another node type, wrap it in a Panel; move a
choice out of the panel it decides, before it.
"""
