id = "ubs-aem-account-holder-wiring"
title = "A party is a Repeatable around its partner generic"
output_formats = ["aem-ubs"]
description = """
The UBS general-fragments directive models a party and its signature from ordinary nodes (backlog
"Parties (V2)", "Signatures (V2)"). A party is a `Repeatable` named `RCP_<stem>` around a `Fragment`
of its role group's partner generic (the roles of each group: ubs-aem-account-holder-cluster),
named by the role: contractual partner
`affrg_ContractualPartnerGeneric1` as `PN_CPGRP`; partner to partner `affrg_PartnertoPartnerGeneric1`
as `PN_AHGRP` (a second one `PN_AHGRP_AR`); beneficial owner `affrg_BeneficialOwnerGeneric1` as
`PN_BOGRP`; power of attorney `affrg_PowerofAttorneyGeneric1` as `PN_PAGRP`. The same names repeat in
every configurator option's panel.

`init_hide` lists the sub-panels the party does not show and `init_show` the hidden ones it does,
following the parts the source shows, in its order (UBS-PTY-3): `PN_IndividualBasic` (last and
first name, shown), `PN_Address` (shown), `PN_EntityBasic` (company name), `PN_FormAddress`,
`PN_DOBNationality`, `PN_DateIncorporation` (hidden). A private person without an address hides
`["PN_EntityBasic", "PN_Address"]`. The writer turns them into the fragment's one Initialize rule
(`hideAFHideDor` and `showAFShowDor`, form and Document of Record alike). Where `PN_Address` shows,
the writer also hides the address fields beyond street, number, postal code, city and country and
makes city and country optional, as for the address fragment (ubs-aem-addresses); a further field
the source shows is shown by its path, `init_show:
["PN_Address.PN_AddressBlock.TXT_State_AddressBlock"]`, and a city or country it requires is
`init_required`.

Fields the source adds to a party (client ID, tax number, place of birth, phone, e-mail: the
generic has none of them) are a content `Panel` in the row, where the source places them, so they
repeat with the party (UBS-PTY-5, types B5). When they sit between the parts of the party (its name,
then a tax number, then its address), the party is split: the row holds copies of the one partner
generic, each showing its own sub-panels and hiding the others, with the content Panel between them.
The first copy keeps the role's name (`PN_CPGRP`), a further copy adds the part (`PN_CPGRP_Address`);
the copies bind to one schema element, so AEM keeps their fields in one party.

A signature is a Repeatable wrapping `affrg_SignatureGeneric1`, both named after the party:
`RCP_SGN_CPGRP` around `PN_SGN_CPGRP` for `PN_CPGRP`; `RCP_Sign_AHGRP` around `PN_Sign_AHGRP` for
`PN_AHGRP` (`RCP_Sign_AHGRP_AR` and `PN_Sign_AHGRP_AR` for `PN_AHGRP_AR`); `RCP_SGN_BOGRP` and
`PN_SGN_BOGRP`; `RCP_SGN_PAGRP` and `PN_SGN_PAGRP`. The name is the pairing: the writer makes the
party's Add and Remove add and remove the signature row too (UBS-SIG-3), and gives the signature
repeatable no buttons of its own, so a misspelled name silently unpairs them. A signature that pairs
with no party (the bank's, `RCP_SGN_UBS` around `PN_SGN_UBS`; a signer whose data the source does
not capture, `RCP_SGN_<stem>` with a stem none of `CPGRP`, `AHGRP`, `AHGRP_AR`, `BOGRP`, `PAGRP`)
keeps its own Add and Remove.

Reported: a partner generic that is not a child of a Repeatable; partner generics of two roles in
one Repeatable; two copies in one row that both show a sub-panel; a sub-panel in `init_hide` or
`init_show` that the generic does not have, or an `init_show` of one it already shows. The build
refuses the last three too, and checks every dotted path against the fragment library. The naming and the signature half are judged by
ubs-aem-account-holder-cluster.

Fix: wrap the bare Fragment in a Repeatable `RCP_<stem>` (title, `min_occur` and `max_occur` from
the source) and name it by the role; give each role its own row; in a split party, hide in each copy
the sub-panels another copy shows; correct the sub-panel names.
"""
