id = "ubs-aem-verbatim-source-text"
title = "Text is the source's own, never the author's"
output_formats = ["aem-ubs"]
description = """
Every label, option, help text, title, paragraph and footnote is taken verbatim from the source, in
each language from that language's own source (CNV-TXT-1): the page text as the form shows it after
its scripts ran (xfa_page_text, xfa_search_text) and the controls' captions and options
(xfa_controls, xfa_field). Copy of the author's own, a paraphrase, a shortened text, a gap filled
with plausible wording, or one language filled with another's text because the two could not be
paired, is a defect. Text identical in the sources themselves (names, codes, legal entity names)
stays identical. The option labels of a dependent dropdown are those its control lists for each
parent value (xfa_controls in a session after xfa_set on the parent). The text the writer or a
fragment renders itself (the step title built from a page `title`, the banking relationship, a
fragment's own fields, the Add button, the letterhead's captions) is not authored and is not
judged. A `Letterhead`'s prefilled addresses and its `subject` are authored and are judged like any
text.

How to judge: walk the document with json_outline and sample the texts it carries: every heading,
every paragraph of static text, every label and option of the first pages and of each page that
differs in kind (a table, a declaration, a signature page), plus every text a finding or an unusual
wording points at. Look each one up in that language's source (xfa_search_text for a distinctive
phrase, xfa_page_text for the page).

A break is a text that does not exist in the source in that language: invented, paraphrased or
shortened.

Fix: replace the text with the source's wording, or delete the node if the source has none.

Precedence, none of which is a break:
- Typography a rule sets: quotation marks per language and entity (ubs-aem-quotes), entity names
  per language, links and Unicode NFC (ubs-aem-text-conventions), footnote references in place of
  typed markers (ubs-aem-footnotes). The words stay the source's own.
- A label or title another rule derives from the source's words: the label of an input the source
  gives no caption, or whose caption is too long for one (ubs-aem-input-labels), a Repeatable's
  title deduced as a short noun phrase for one row (ubs-aem-repeatable-title), a signature's title
  naming its signer. Wording that no source text supports still is a break.
- Where a page exists in one language only (another language's source prints it in the same
  wording), every language carries that wording, copied from the source: it is the source's own
  text in each language, a party Repeatable's title on that page included.
"""

[judge]
# Walks every page of the source in every language.
max_turns = 80
