# The signature part mirrors `find_signature_family.py` (PROBLEM-signature-hardcoded-family) of the
# feedback repo. `SIGNATURE_FRAGMENTS` in check.js is the set of signature fragments its catalogue
# (`fragment_migration.FRAGMENTS`) knows a signer-name field for.
id = "ubs-aem-signature-family"
title = "Numbered copies of a block are one repeatable"
output_formats = ["aem-ubs"]
description = """
Copies of one block that the source numbers by hand ("Signature 1", "Signature 2", "Erbe 1",
"Erbe 2" as separate blocks) are one Repeatable with `min_occur` and `max_occur` both N, the number
of copies, when they are identical apart from the number; copies that differ (other captions,
inputs or required states) stay separate (UBS-REP-3). AEM numbers the rows itself ("1." and "2." from
two rows, nothing for one), so signature slots in particular are never numbered copies.

Reported, for blocks whose names differ only by a trailing one- or two-digit number (after `_`, `-`
or a space, or none), numbered exactly 1 to N, N at least 2:

- signature blocks anywhere in the form: a node wrapping one of the signature fragments
  (`affrg_SignatureGeneric1` and the market signature fragments), or a Panel or Repeatable whose name
  contains `sign`, `signat`, `firma` or `unterschrift` and which holds a node named likewise;
- sibling Panels holding no signature that are the same block once their digits are dropped (node
  types, names, texts, options, required states).

Replace the copies with one Repeatable titled with their wording, number removed ("UBS Europe 1" and
"UBS Europe 2" give "UBS Europe"; ubs-aem-repeatable-title), and rename anything that named a
removed block. Signature slots are a Repeatable `RCP_SGN_<stem>` wrapping `affrg_SignatureGeneric1`
named `PN_SGN_<stem>` (backlog "Signatures (V2)").
"""
