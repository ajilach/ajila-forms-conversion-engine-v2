id = "ubs-aem-standard-sections-are-fragments"
title = "Standard blocks are the bank's fragments"
output_formats = ["aem-ubs"]
description = """
The blocks whose inputs the UBS profile defines (types section 2) are the bank's fragments wherever
the source has them, none lost and none invented. What each source block becomes:

- a party (a person or company in a role) is a partner generic in its row
  (ubs-aem-account-holder-cluster, ubs-aem-account-holder-wiring); a name pair with no role is
  `TextField`s (UBS-PTY-8);
- a single name input ("Last name, first name(s) / Company", no separate last and first name) is a
  `TextField` followed by the address fragment, even under a heading that names a role: it is not a
  party, and this takes precedence over the bullet above (UBS-PTY-8);
- an address is the address fragment, or the party's `PN_Address`; the addressee window and a
  branch contact block are not addresses (ubs-aem-addresses);
- a signature block is `affrg_SignatureGeneric1` in its Repeatable (ubs-aem-signatures);
- an account number with its parts is the account fragment of its kind, or a row of `TextField`s
  where the source fixes a part; a single account field is a `TextField`; an IBAN is
  `affrg_IBAN1` or `affrg_IBAN2` for the IBAN of the banking relationship or the custody account,
  and a `TextField` for one the client enters (ubs-aem-account-numbers);
- the banking relationship (a "Bankbeziehung", "Banking relationship", "Relazione bancaria" field) is
  the `Preface`, exactly when the source has one (ubs-aem-page-header);
- each internal-bank-use block is the global fragment for the standard combination (OU reference,
  signatures verified, visa) and the content panel `PN_InternalBankUseOnly` with every source field
  for any other content (ubs-aem-global-internal-bank-use, UBS-IBU-4).

Every fragment (types B1, B3, B6, UBS-WRD-1):

- is OPAQUE: AEM supplies its fields at runtime with the profile's own labels. It has no children,
  its fields are never recreated beside it, and its `bind_ref` stays. What it shows, hides and
  requires is set on the `Fragment` by path inside it (`init_hide`, `init_show`, `init_required`,
  `init_optional`), which the writer turns into its one Initialize rule: the fields the source
  shows, its heading where the source's differs, the inputs the source requires. The fields the
  source adds and the fragment does not have are nodes of their own beside it (a content Panel in a
  party row, a field after the address fragment, a content Panel inside a signature Repeatable);
- references `/content/dam/formsanddocuments/<library>/<fragment>`: the UBS generics of
  `afforms_ubs_fragmentlib` (the Germany and Italy person, address and signature fragments are
  retired), the global library for internal bank use;
- takes the source's heading as a `TitleDraw` right before it where the fragment does not print
  that heading itself, and none where the source shows none;
- never replaces a conditional Panel (one with show and hide behaviour).

How to judge: list the source's blocks with xfa_render_pages, xfa_page_text, the template (xfa_search
and xfa_node for headings and master-page text) and xfa_controls (path hints `FamilyName_FirstName`, `Company`,
`Street_StreetNumber`, `PostalCode_City_Country`, `Reciever_Address`, `BankingRelationship`,
`CustodyAccount`, `IBAN`, `Signature`, `STP_UP`), with a session (xfa_open, xfa_set) for what a
configurator option shows. Compare with the document's fragments (json_search
for `frag_ref`) and loose fields (json_outline).

A break is a standard block built from loose fields where its fragment applies, or a fragment where
the source has no such block (a role-less name pair, an addressee window, a branch contact block, a
single account field, an IBAN the client enters); a fragment or `Preface` for a block the source does
not have, or none where it has one; a fragment's fields recreated or given children; a fragment path
the library does not hold; a source field of the block lost (an extra address field, a fixed account
part, internal-bank-use content beyond the standard combination squeezed into the global fragment);
a fragment of the wrong kind (a custody account as an account).

Fix: replace the hand-built block with its fragment, or the fragment with the source's fields; add
or delete the `Preface`; delete a fragment's children and recreated fields; add the source's extra
fields beside the fragment; correct the fragment path.
"""
