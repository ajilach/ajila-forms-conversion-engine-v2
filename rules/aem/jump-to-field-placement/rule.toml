# Mirrors the UBS writer: `Lower::step_title` (`lower.rs`) gives a titled step's title panel the
# button when the step holds an input and no repeatable and is not the configurator, and
# `collect_jump_to_field_repeatables` (`xml_writer.rs`) gives every repeatable, nested ones
# included, on a page with an input one per row. An authored `jump_to_field` is written only on a
# non-conditional Panel, in addition to those.
id = "ubs-aem-jump-to-field-placement"
title = "The writer places the summary's Edit buttons"
output_formats = ["aem-ubs"]
description = """
The summary's Edit button (`jump_to_field`) jumps back to something a person filled in. The writer
places it (backlog "Jump to field" and "Manual changes"): on the step-title panel of a titled page
that holds an input and no repeatable, and on every row of every repeatable (nested ones and
signatures included) on a page that holds an input. None goes on a text-only page or on the form
configurator's step title. So leave `jump_to_field` unset; an authored one is written on a
non-conditional Panel in addition, a second button or one in the wrong place, and ignored anywhere
else.

Reported, for a node with `jump_to_field: true`:

- it is not a Panel, or a conditional one: the writer ignores it;
- it is the form configurator (`PN_FormConfigurator...`): it would join the summary's jump list;
- it holds nothing to fill in (no input, fragment or letterhead below it);
- it is a titled page, or a Panel on a titled page without repeatables: the step-title panel already
  carries the button, so AEM would render two above one heading;
- it is inside a repeatable or holds one: the rows carry the buttons.

The fix deletes `jump_to_field` from every reported node. An untitled page that holds an input and
no repeatable gets no button from the writer, and may keep its own.
"""
