# Merges legacy-table-panels, whose check (a `TBL_` panel of nothing but static draws, the workaround
# from before AEM had a table component) is the scripted part here, with the judgement of where the
# source has a table (CNV-STR-3, CNV-STR-4, UBS-REP-4; backlog "Tables", "Tables with inputs").
id = "ubs-aem-tables-are-html-tables"
title = "Tables are HtmlDisplayer tables or row panels"
output_formats = ["aem-ubs"]
description = """
A table is a grid of aligned rows (CNV-STR-3, UBS-REP-4), even when only some rules are drawn, when it has a
single column, when a column is empty on every row, or when its header row has no rules. A run of
one-line texts that the page shows as such a grid is a table, and so are header cells drawn as
separate headings above data cells.

- A table of text only is ONE `HtmlDisplayer` named `TBL_...` whose `content` is a real table in
  every language: `<thead>` with `<th>` for the header row, `<tbody>` with one `<tr>` per source row
  and `<td>` per cell, `rowspan` for a category cell spanning sub-rows, `colspan` where cells merge,
  inline `style` widths for the source's column proportions.
- A table whose cells hold INPUTS stays components, since markup is static: a Panel named `TBL_...`
  with one row Panel per source row holding the cells side by side at the source's column widths.
  Rows the person adds and removes are one Repeatable row (CNV-STR-4) titled by what a row is
  (ubs-aem-repeatable-title). An input in a cell is labelled with its column header, completed
  with the row label when the header alone does not say what is asked.

Reported: a `TBL_` Panel holding only TextDraws and TitleDraws (a text table laid out as draws:
replace the draws with one HtmlDisplayer, never group them in a panel or build a grid of draws),
and a `TBL_` HtmlDisplayer whose table differs between languages in its header, its number of rows
or a row's cells. A `TBL_` HtmlDisplayer without a `<table>` is ubs-aem-html-displayer-markup's.

Also judge on the source pages (xfa_render_pages, xfa_render_region for a grid's cells): find each
table, check that it is one of the two shapes with the source's header, rows
and columns, and look at every run of consecutive one-line draws (json_outline) for a grid the page
shows. Fix a missed table by removing the loose draws and adding the table in their place.
"""
