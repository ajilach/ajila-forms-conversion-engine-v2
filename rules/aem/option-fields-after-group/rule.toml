id = "ubs-aem-option-fields-after-group"
title = "A choice list is one node, fields after it"
output_formats = ["aem-ubs"]
description = """
A list of radio buttons or checkboxes that answers one question is ONE node with all its options,
in source order (UBS-INP-6, UBS-INP-7, CNV-INP-5):

- radio buttons of one exclusion group (`group` in `xfa_controls`) are one RadioButton; single
  radio buttons that clear each other when clicked in a session (xfa_open, xfa_click) are one too;
- checkboxes aligned in a row, column or grid under one question are one Checkbox list; a checkbox
  that is a statement of its own is a Checkbox of its own; checkboxes the source keeps mutually
  exclusive (ticking one clears the other in a session) are one RadioButton.

The list is not split, even where the source places inputs or text between its options: AEM has
no way to join parts into one choice, so the parts would answer independently. What belongs to an
option (an "Other: ____" line, a block it reveals: what `appeared` when xfa_set chose it in a
session) goes after the
whole list, inside a conditional Panel shown by a `ConditionRule` on that option
(ubs-aem-condition-targets). An input there without a caption of its own is labelled with the
option's text, or enough of it to identify the option (CNV-INP-2).

How to judge: look at every run of neighbouring Checkbox or RadioButton nodes (json_outline) and at
every input or panel between two of them, and compare with the page (xfa_render_pages) and the
controls (`group`, `positions`).

A break is a list the source answers as one that is authored as several nodes, checkboxes of one
question kept apart, an input or panel between the parts of a list, or an option's field placed
before its list.

Fix: merge the pieces into one node with all options (renumbered, ubs-aem-options-wellformed);
move the option's content after it, inside a conditional Panel, with a `ConditionRule` on that
option.
"""
