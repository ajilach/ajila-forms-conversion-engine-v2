id = "ubs-aem-options-wellformed"
title = "Options have real values"
output_formats = ["aem-ubs"]
description = """
Every option of a Dropdown, Checkbox or RadioButton carries a label (in every language) and a
`value` the form submits. A blank `value`, or two options of one control that share a value, make
the submitted data and every condition on that control ambiguous. Take the values verbatim from
the source (the XFA item values, or the `addItem` and `rawValue` lines of a change script); never
invent one. An empty label is reported by the ubs-aem-text-languages-complete rule.

Set each option's `value` to the source's own value, and make duplicates distinct as the source
does.
"""
