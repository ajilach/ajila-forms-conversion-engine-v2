# The writer emits an HtmlDisplayer's markup verbatim into its `localeContent` (htmldisplayer.xml)
# and sanitizes nothing, so what the markup holds is the author's to get right (backlog "HTML
# component (V2)").
id = "ubs-aem-html-displayer-markup"
title = "HtmlDisplayer markup survives into the PDF"
output_formats = ["aem-ubs"]
description = """
An `HtmlDisplayer` is the AEM HTML component. Its `content` is HTML markup per language, and it is
the only node whose content is markup you write yourself. Name it for what its markup shows:
`TBL_` holds a real `<table>` (`<thead>` and `<th>` for the header row, `<tbody>`, `<tr>` and
`<td>` for the body, one `<tr>` per source row; ubs-aem-tables-are-html-tables), `CRT_` holds an
inline `<svg>`, `IMG_` holds an `<img>` whose `src` is a `data:` URI. Inline `style` attributes for
widths, padding and alignment are fine, and so is a link (`<a href="https://…" target="_blank">`,
ubs-aem-text-conventions).

These do not survive into the printed document, or do not load, and are reported: a `<script>`,
`<link>`, `<style>`, `<iframe>`, `<object>` or `<embed>` element, form controls (`<form>`,
`<input>`, `<select>`, `<textarea>`, `<button>`), a `src` that is not a `data:` URI, and an `href`
that runs script (`javascript:`). A `TBL_` HtmlDisplayer without a `<table>` and a `<tr>`, a
`CRT_` without an `<svg>` and an `IMG_` without a `data:` `<img>` is named for something it does
not hold. Every language's markup is held to this.

Rewrite `content` in every language to markup of the allowed shape, or rename the node to the
prefix its markup matches. A table whose cells hold inputs is never an HtmlDisplayer: it is a
`TBL_` Panel of row panels holding the inputs (ubs-aem-tables-are-html-tables).
"""
