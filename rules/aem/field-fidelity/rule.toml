id = "ubs-aem-field-fidelity"
title = "Each field matches its source control"
output_formats = ["aem-ubs"]
description = """
Every fillable source field is the right control with the source's options, default, required
state, read-only state, length limit, visibility and width.

Which controls count: every control `xfa_controls` lists, except those never visible (hidden by
default and in no `appeared` of any choice in a session), barcodes, images, the footer line's fields and
buttons (an add or remove control, save, print, mail, submit, navigation, link; CNV-SRC-5,
CNV-SRC-6). The document has no button node: an add or remove control is the Repeatable's own, and
any other button has no node either; keep what its click does to the form where the typed fields
can say it (`calculate`, `copy_from`, `conditions`). Its type
follows its `kind`: `text` a TextField (`Multiline` when `multiline`), `text_area` a Multiline
TextField, `numeric` a NumberField, `date` and `date_time` a DatePicker (ubs-aem-dates), `time`
and `password` a TextField, `dropdown` a Dropdown (a Checkbox list when `multi_select`), `radio`
one option of a RadioButton (its `group` is the group), `checkbox` a Checkbox or one option of a
list (ubs-aem-option-fields-after-group). Email and telephone follow ubs-aem-email-phone-kind. A
`text` control whose caption or label asks a date ("Date of birth", even where the caption is a
separate draw or field beside it) is a DatePicker: ubs-aem-dates takes precedence over the kind.

Its properties: options in the source's order with the labels it shows, none missing or invented
(values: ubs-aem-options-wellformed); `default_value` from `default`; `mandatory` from `mandatory`
(a Checkbox too, where a confirmation must be ticked); `read_only` where `access` is not `open`
and no choice opens it (ubs-aem-copied-values; one a choice locks or opens has `enable_conditions`
on that choice instead, ubs-aem-conditional-access); a TextField's `max_chars` from `max_chars` (a Multiline field takes no
limit); a NumberField's `lead_digits` and `frac_digits` from its `format` picture or `max_chars`
(`frac_digits` 0 for whole numbers); `visible`; `colspan` from `positions` and the page (12 full
width, 6 where two fields share a row; ubs-aem-grid-widths).

A fixed selection (CNV-INP-7), ticked by the source and not open for change, is not required: a
Checkbox with `default_value` "1" and `read_only: true`. AEM cannot lock one option of a list: a
fixed option of a list whose other options stay open becomes a Checkbox of its own beside the list,
in source order, with `default_value` its option's value and `read_only: true`. A fixed radio
choice is the RadioButton with `default_value` and `read_only`.

A configurator (a RadioButton or Dropdown in a panel named `PN_FormConfigurator...`) is a
RadioButton with `alignment` `Horizontal`, whatever the source uses (backlog "Configurator
rendering"); everything else is judged as for any field, its default included: nothing is
preselected by wording. A field inside a panel a condition shows is judged `visible` relative to
that panel. A field a fragment or the `Letterhead` supplies is the bank's standard and not judged;
a free-text country of an address is the fragment's country dropdown (backlog "Free text country").

Inputs inside running text (CNV-INP-6): a row Panel without title holding TextDraw, input,
TextDraw in sentence order; words after the last gap stay a TextDraw after the input, never its
label. Words that switch with another input ("calendar"/"business day(s)") are conditional
variants of the text, never of the input, so its value survives. A value only printed in a
sentence follows ubs-aem-floating-fields.

How to judge: compare each node (json_outline) with its control in xfa_controls and with the
rendered page (xfa_render_pages); reveal hidden parts in a session (xfa_open, xfa_set).

A break is any difference above. Fix: replace the node by the right type, or set the property.
"""

[judge]
# Walks every page of the source in every language.
max_turns = 80
