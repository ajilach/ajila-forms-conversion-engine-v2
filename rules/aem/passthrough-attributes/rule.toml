# Mirrors the detectors of the feedback repo that read a deployed package's raw attributes and
# nodes: `excludeFromDoRIfHidden="true"` (PROBLEM-dor-exclude-hidden), `defaultToCurrentDate="true"`
# (PROBLEM-datepicker-current-date-default), a `dorExclusion="true"` tag without
# `summaryExclusion="true"` (PROBLEM-dor-exclusion-implies-summary), the default panel component
# `sling:resourceType="fd/af/components/panel"` (PROBLEM-panel-type-ubs) and a visibility script
# with no Initialize rule (PROBLEM-visible-on-init).
id = "ubs-aem-passthrough-attributes"
title = "A loaded node keeps no retired attribute"
output_formats = ["aem-ubs"]
description = """
A document loaded from a deployed package keeps, in a node's `passthrough`, the attributes and child
elements the typed fields do not model, and the writer emits them as they are. `passthrough` exists
only for that: never author it. A few loaded shapes are retired by the corpus and fail the feedback
guard, so a loaded form is repaired here, never carried over:

- `excludeFromDoRIfHidden="true"` (in `raw_attributes` or a `raw_children` element): a hidden node's
  Document of Record presence is decided by `always_in_pdf` and `summary_exclude`.
- `defaultToCurrentDate="true"`: a date picker does not preset today's date.
- `dorExclusion="true"` without `summaryExclusion="true"`: the Document of Record is rendered from
  the summary, so a node excluded from one is excluded from both. A typed node's `dor_exclude`
  writes both; this fires where the passthrough is what the writer emits (a FootnotePlaceholder's
  own attributes, a `raw_children` element).
- `sling:resourceType="fd/af/components/panel"` in a `raw_children` element: every panel is the UBS
  panel.
- An `fd:scripts` element in `raw_children` with an `fd:visible` rule and no `fd:init`: a visibility
  rule only runs when its inputs change, so the form opens with the wrong state.

The fix deletes the first three attributes. Re-express the other two with typed nodes and fields (a
Panel node; a condition on the trigger with `is_conditional` on the panel, for which the writer
writes the visibility rule and its Initialize twin), then delete the element.
"""
