id = "ubs-aem-no-untranslated-stubs"
title = "Each language carries its own source's wording"
output_formats = ["aem-ubs"]
description = """
A text of a non-master language whose wording merely repeats the master-language text is an
untranslated stub, not a translation (CNV-TXT-1): AEM then shows the master wording in that
language and the form reads as a mix of languages. Each language's text comes from that language's
own source, never from another language because the two could not be paired.

Exempt: a text identical in the sources of every language (a proper noun, a code, a number, an
acronym, an address, a legal entity name, a form code); a packager-derived synonym locale (`de-ch`
from `de`, `es` from `sp`), which must match its base language, so never report it; and content
that only some language sources carry (ubs-aem-language-specific-content), whose keys in the other
languages carry the wording of a language that has it.

How to judge: the master language is English when the form ships it, otherwise the first language
of `/languages`. For each other language, list the texts equal to the master text (json_search for
the master wording, then the sibling language keys of every hit: titles, labels, contents and
option labels) and look each up in that language's source (xfa_search_text, xfa_page_text). A text
that the source also writes identically in that language passes.

A break is a text of a non-master language that equals the master text although that language's
source words it otherwise.

Fix: replace the copy with the wording of that language's source.
"""
