# The first half (no language outside `languages`) is also refused when the package is built
# (`validate` in the UBS layer's `document.rs`); the second half (no language missing) is not, so
# AEM silently falls back to the master text for that string.
id = "ubs-aem-text-languages-complete"
title = "Every text in every form language, no other"
output_formats = ["aem-ubs"]
description = """
Every user-visible text is a map from language code to text: the `title` of a page Panel
(`is_page: true`, which the writer renders as the heading), the `title` of a Repeatable (which
names each row and its Add button), the `label` of an input, the `content` of a TextDraw,
MessageBox, TitleDraw and HtmlDisplayer, and the `label` of each option of a Dropdown, Checkbox or
RadioButton. `languages` lists the languages the form ships, one per source (CNV-SRC-1). (The title
of a Panel below page level does not render and a Fragment's title is never written, so neither is
held to a language here; the form title is ubs-aem-form-title's.) A text written in at least one language must be written, non-empty, in every
language of `languages`, and its keys must all be in `languages`.

A missing language is not a harmless gap: AEM falls back to the master language for that string,
and the reader sees a mixed-language form. A key outside `languages` is refused when the package is
built. A text empty in every language (a deliberately empty title, a checkbox label left to its
options) is fine. Never author a synonym locale (`de-ch`, `es` beside `sp`): the packager derives it
from its base language, and writes the profile's own UI texts into every dictionary itself.

Fix a missing or empty entry with `add` or `replace` on the pointer the finding names, using that
language's source wording: read that language's source (xfa_search_text, xfa_page_text), pair the
text by meaning and layout position, and never copy the master text or invent a translation. The
one exception is content a language's source lacks altogether (CNV-TXT-4,
ubs-aem-language-specific-content): its key in that language carries the wording of a language that
has it. For a key not in `languages`, delete it, unless the language belongs in the form: then it
is a source language left out of `languages` (add it there and write the form in it).
"""
