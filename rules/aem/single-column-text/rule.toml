# AEM has no multi-column layout for text, so a region the source sets in columns is one column in
# the form (UBS-TXT-6, backlog "Static text width (V2)"). check.js decides the widths and the CSS
# columns in style attributes; a layout table of prose and whether a columned region was linearised
# in reading order need the rendered pages and are the author's to judge.
id = "ubs-aem-single-column-text"
title = "Text is one full-width column"
output_formats = ["aem-ubs"]
description = """
AEM does not support a multi-column layout for text. Every static content node (`TextDraw`,
`TitleDraw`, `MessageBox`, `HtmlDisplayer`) is full width: `colspan` 12, and `dor_colspan` unset or
12 (UBS-TXT-6). A source region that sets its text in two or more columns becomes ONE column, in
reading order: the first column top to bottom, then the next, with its headings where they stand.
Do not rebuild the columns: no panel of half-width texts, no narrow panel wrapping text as a column
(not even beside fields), no HTML laying prose out side by side (a CSS `column-count` or `columns`
style, a borderless `<table>` of paragraphs next to each other). A real table, a grid of rows and
cells, stays a table (ubs-aem-tables-are-html-tables).

The one narrow text: a short fixed text on an input's row (a fixed account number part such as
"0319 00", a unit, a prefix) keeps its place there, at the width the row leaves it (UBS-ACC-6).
Fields may share a row too (ubs-aem-grid-widths).

Reported: a text node narrower than 12 that shares no grid row with an input (rows fill 12
columns left to right), a panel narrower than 12 that holds only text, and HTML that sets text in
CSS columns. Also check on the rendered page (xfa_render_pages) that each columned region reads in
order, with no text lost or doubled where the columns meet.

Fix: set the text node's `colspan` to 12 (and `dor_colspan` 12 or unset), move the texts of a
column wrapper panel up into its parent in reading order and remove the wrapper, and rewrite
columned HTML as consecutive paragraphs.
"""
