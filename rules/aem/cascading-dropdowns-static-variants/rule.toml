id = "ubs-aem-cascading-dropdowns-static-variants"
title = "A dependent list is static variants"
output_formats = ["aem-ubs"]
description = """
When the options of one dropdown (or radio group) depend on another choice (CNV-INP-9), do not
make a single dropdown change its options at runtime, and do not gate the variants with a
value-commit or change rule (for visibility that shape validates but does not fire in this
profile). Model it as static variants: one dropdown per parent value, each in its own Panel
holding ONLY the options the dependent control lists for that value, authored `visible: false`
AND `is_conditional: true`, shown by a `ConditionRule` on the parent (its `conditions`: one per
parent value, targeting that variant panel's `name` with `show: true`). Each variant's options are
labelled verbatim as the source lists them for that parent value and numbered "1" to "n" like any
list (UBS-GEN-3). A third level depends on all its ancestors, not only its parent: put each
third-level variant panel inside the second-level variant panel whose dropdown shows it, so a
stale upstream value cannot keep it visible. A value the source fills in per parent value (a code
the xfa_set result lists as changed) is a read-only TextField with that `default_value` in each
variant panel.
(That the targets exist and are conditional is checked by ubs-aem-condition-targets.)

How to judge: find the dependent controls (in a session, a parent value whose xfa_set result
changes another choice, or `affects_layout` in xfa_controls). For each parent value, open a session (xfa_open), set it
(xfa_set) and read the dependent control's options with xfa_controls (xfa_field); for a third level
set both ancestors. Then compare with the tree: one variant Panel and dropdown per parent value,
with exactly that value's options in that order, and a condition on the parent per value.

A break is a dependent list modelled as one dropdown, a parent value with no variant, a variant
whose options differ from the source's for that value, a variant not gated on the parent, or a
deeper level that a stale ancestor value can keep visible.

Fix: add the missing variant panel with its own dropdown; add the condition on the parent; nest a
deeper level inside the variant of its parent.
"""
