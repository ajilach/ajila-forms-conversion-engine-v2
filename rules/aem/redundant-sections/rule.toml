id = "ubs-aem-redundant-sections"
title = "A choice that makes a section redundant hides it"
output_formats = ["aem-ubs"]
description = """
Some source choices make a whole section redundant without hiding it: choosing "the beneficial
owner is the same as the client" copies the client rows into the beneficial-owner rows, locks
them and removes their add and remove buttons. AEM has no choice-dependent lock or copy
(ubs-aem-copied-values), so such a section is a conditional Panel that the other values show:
the choice carries a `ConditionRule` with `show: true` for each value under which the section is
still filled in, pointing at the section's Panel, and that Panel is `is_conditional: true` and
`visible: false` (ubs-aem-condition-targets). A section on its own page is that page's Panel.

Such a choice is found in a session (xfa_open, xfa_set of each value): its result lists the
section's inputs in `access_changes` (open to protected) or its rows in `instances_changed`, or
the section's values change with the choice's (xfa_read of the choice's `change` script shows
`access = "protected"`, `setInstances` and copies). Its heading or its question often says so
("Beneficial owner(s) if they are not the same as the Client(s)", "Contractual partner(s) and
beneficial owner(s) are the same").

A choice that only locks or unlocks single inputs, without making a section redundant, is not
this rule's (ubs-aem-copied-values, ubs-aem-field-fidelity).

How to judge: for each RadioButton, Checkbox and Dropdown, set each of its values in a source
session and compare what happens to the sections with its `conditions` in the document
(json_get).

A break is a section the source makes redundant under a value that the form still shows under
that value, or a section hidden under a value under which the source keeps it open.

Fix: wrap the section in a Panel (or use its page's Panel), set `is_conditional: true` and
`visible: false` on it, and add a `ConditionRule` with `show: true` on the choice for each value
under which the source keeps the section open.
"""
