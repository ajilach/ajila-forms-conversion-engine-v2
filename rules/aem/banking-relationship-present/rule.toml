id = "ubs-aem-banking-relationship-present"
title = "The banking relationship Preface, once on the first page where the source has one, and no separate entity line"
output_formats = ["aem-ubs"]
description = """
A form carries the banking relationship exactly when its source does: a "Bankbeziehung" /
"Banking relationship" / "Relazione bancaria" field (xfa_controls, xfa_render_pages). Then author a
single
`Preface` node among the first page's children (the first `Panel` under `form` that is a wizard
step), not a hand-built Fragment or Panel. The template renders it as the standard `PN_BR` wrapper
(excluded from the Document of Record and the summary) around the UBS fragment
`affrg_BankingRelationship1`, so you supply neither the fragment path nor the exclusion flags,
and never a germany, italy or global variant or a dam-path reference (the
ubs-aem-banking-relationship rule holds the hand-built shapes to the canonical one). A source with
no banking relationship (AACU_019, for one) gets no `Preface`: do not add one.

The fragment renders the "UBS Europe SE" line itself, so beside a `Preface` a standalone TextDraw,
TitleDraw or MessageBox whose text is only the entity line, "UBS Europe SE" or Italy's "UBS Europe SE
(Succursale Italia)", in any language duplicates it. The
legal-entity line reaches the Document of Record header as its own hidden `slot2` draw
(ubs-aem-dor-header-slots), which is not such a duplicate.

Reported: a second `Preface`, a `Preface` outside the first page, and beside a `Preface` a body
draw that is only "UBS Europe SE". Whether the source has a banking relationship at all is judged
by ubs-aem-standard-sections-are-fragments.

Add `{"type": "Preface", "name": "PN_BR"}` as the first of the first page's `children` when the
source has the block, remove a `Preface` the source has no block for, and delete any body draw whose text is "UBS Europe SE"
(where it heads the bank's signature block, it becomes that signature Repeatable's `title`). In a
letter (a form with a `Letterhead`) the closing is the exception: the entity line and any unit line
under it ("Front Support Office") are one body `TextDraw`, verbatim and in the source's order, right
above the bank's officers, and are not reported (ubs-aem-letter-bank-signature).

Precedence: this rule wins over ubs-aem-sub-headings-are-title-draws. Where the source heads the
bank's signature block with "UBS Europe SE", the heading is the `title` of that signature
Repeatable (AEM renders it as "UBS Europe SE 1", "UBS Europe SE 2"), never a draw.
"""
