# Mirrors the two detectors of the feedback repo: `find_panel_noncanonical.py` run for
# PROBLEM-banking-relationship-fragment (the fragment is the canonical path and the panel carries
# `dorExclusion`) and `find_missing_attr_on.py` run for PROBLEM-banking-relationship-margin (a
# `PN_BR` tag carries `ubs-margin-20`). The `Preface` template (`preface.xml`) writes both right.
id = "ubs-aem-banking-relationship"
title = "Banking relationship: canonical fragment in PN_BR"
output_formats = ["aem-ubs"]
description = """
The banking relationship (UBS-PAGE-1) is a `Preface` node, the first child of the first page
(ubs-aem-page-header). The writer renders it as the `PN_BR` wrapper with the class
`ubs-margin-20`, excluded from the Document of Record and the summary, around the canonical
fragment `/content/forms/af/afforms_ubs_fragmentlib/affrg_BankingRelationship1`, which prints the
relationship in the Document of Record header's `slot1` under its own localized label. For entity
019 the writer also presets the clearing number to `0319`. None of this is authored: no fragment
path, no flags, no default.

A hand-built block is the old shape: never a germany, italy or global variant of the fragment or a
dam-path reference, and a hand-built wrapper missing either exclusion flag is a defect, not a pass.
Two shapes are reported:

- A node whose `frag_ref` names a banking relationship fragment (anything containing
  `BankingRelationship`, except the custody-account fragments) but is not exactly
  `/content/forms/af/afforms_ubs_fragmentlib/affrg_BankingRelationship1`. Replace the node with a
  `Preface` on the first page, or point `frag_ref` at that path.
- A hand-built node named `PN_BR` (not a `Preface`) whose `css` is not exactly `ubs-margin-20`.
  The guard requires that exact value, so set `css` to `ubs-margin-20` with no other classes, or
  use a `Preface` node instead.
"""
