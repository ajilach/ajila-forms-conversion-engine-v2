# The writer side, in the UBS writer (`xml_writer.rs`): `is_configurator_band` is a panel named
# `PN_FormConfigurator*`, and `collect_configurator_resets` writes the reset-on-change rule
# (`scripts::configurator_reset`) for every RadioButton or Dropdown inside it, emptying every Panel
# its `show: true` conditions name and resetting their repeatables first. `lower.rs` refuses a choice
# that carries rules of its own beside a generated one, and excludes the band's step title from the
# DoR and the summary.
id = "ubs-aem-configurator-panels"
title = "The form configurator: band, choice, variants"
output_formats = ["aem-ubs"]
description = """
A configurator is an input of the source's configurator band (UBS-CFG-1): the screen-only block on a
tinted band at the top of the first page, headed "Form configurator" (`xfa_controls` paths with
`FormConfigurator`; screen-only, `relevant="-print"` on its subform in the template, xfa_node):
client type, branch, currency, client advisor, financial
intermediary flag. A choice that shows or hides content inside a section (a Yes/No question) is not
a configurator and stays in its section, whatever its options say.

- Band (UBS-CFG-2, UBS-SEC-4): the configurator inputs are direct children of one Panel named
  `PN_FormConfigurator_<suffix>`, the form's first page, titled with the band's heading. The section
  it configures first shares that page: it follows the inputs inside the same page Panel, opened by
  its heading as a level-2 TitleDraw, never as a page of its own. When the source has a subtitle,
  which the writer prints only from a first page that is not the band, the first page is an
  ordinary page titled with the subtitle and the band is a Panel directly inside it, first after the
  page header (ubs-aem-form-title). No other node takes that name.
- Choice: a configurator RadioButton or Dropdown is a RadioButton with `alignment: "Horizontal"`,
  whatever the source control (backlog "Configurator rendering"). Options and their order are the
  source's; `default_value` is the option the source opens with (`default` in `xfa_controls`), none
  when it opens empty; the label is the source's, with `hide_title` only where the source prints
  none beside it (UBS-INP-1).
- Variants (UBS-CFG-3): read what each option shows and hides in a session (`xfa_open`, `xfa_set`
  per option, `xfa_reset` between options; the result lists `appeared`, `disappeared` and
  `access_changes`, and the instances added or removed appear and disappear under indexed paths),
  and the captions and texts that change per option (`xfa_controls` and `xfa_page_text` after each
  `xfa_set`).
  Content whose structure differs per option (other inputs, bounds or behaviour) is one conditional
  Panel per option, shown by a `show: true` condition for each option that shows it. Content shared
  by all options appears once, outside those panels. Content that differs only in wording stays one
  component; a text that changes becomes variants of that text, never of an input.
- Reset (UBS-CFG-4): the writer writes it. Changing a configurator RadioButton, Dropdown or
  Checkbox (the financial intermediary flag) empties every Panel its `show: true` conditions name,
  their repeatables back to `min_occur`; the writer reads no `show: false` condition. Write no
  reset of your own and keep none a loaded package had.

Reported: a `PN_FormConfigurator` panel that is not the first page, or a second one; a Dropdown, or
a RadioButton not `Horizontal`, among the band's direct children; a `show: false` condition on such a
choice; a script in a node's `passthrough` that calls `resetData` or `resetAllPanelInstances` and is
not the writer's (`Generated automatically`).

The fix makes the band's choices horizontal RadioButtons. By hand: move the band to the first page,
express each option's content with `show: true` conditions, delete the hand-written reset.
"""
