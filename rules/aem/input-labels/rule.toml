id = "ubs-aem-input-labels"
title = "Every input has a usable label in every language"
output_formats = ["aem-ubs"]
description = """
Each text, number and date field, dropdown, checkbox and radio button presents a label, in each
of the form's languages. A label is not usable when it is empty, when it is only a parenthetical
hint such as `(optional)`, or when it carries markup: labels are plain text.

A checkbox whose options carry the text may leave its own label empty.

The check decides empty, parenthetical-only and marked-up labels. Whether the text is the real
question is for you to judge against the source page: a caption that merely sits near a field in the
XFA (a parenthetical aside, a rich-text paragraph) is not its label. Check each field against the
source page, put the real question into the label, and leave any hint as its own static text.
Use the question the source asks next to the field. A hint in brackets belongs to the question,
not in its place.

Precedence: this rule wins over ubs-aem-verbatim-source-text where the source gives an input no
caption. The label is then the nearest source text that names the input, the caption of its group
or the text of its option, verbatim and without surrounding brackets. Never leave it empty and
never write wording of your own.
"""
