# The other half of this problem is guaranteed: every template writes `summaryExclusion` for a
# node with `dor_exclude` (`{% if dor_exclude or summary_exclude %}`), so `dor_exclude` alone still
# keeps the node out of the summary. `normalize.rs` repairs the flags of the internal-bank-use
# fragments only; every other node keeps what the document says.
id = "ubs-aem-placement-flags"
title = "PDF-only nodes never carry dor_exclude"
output_formats = ["aem-ubs"]
description = """
Where a node shows up is decided by separate switches. The UBS Document of Record is rendered by
Redacto from the summary data, so `summary_exclude` is what keeps content out of it; `dor_exclude`
is Adobe's own and is not read on that path (the writer sets `summaryExclusion` for it as well).
`always_in_pdf` puts a hidden or summary-excluded node back into the printed document, and
`dor_exclude_title` leaves out a panel's heading only, not the panel.

A node shown in the printed document only (an internal-bank-use block, the DoR copy of an infobox, a
header slot text) has the PDF-only shape (backlog "PDF-only shape (V2)"): `visible: false`,
`always_in_pdf` and `summary_exclude`, never `dor_exclude`, which drops it from the printed document
again, and nothing in the writer takes it back off (only the internal-bank-use fragments are
repaired).

Reported: a node with both `always_in_pdf` and `dor_exclude` (pointer `<node>/dor_exclude`).

The fix deletes `dor_exclude` and sets `summary_exclude`, which keeps the node out of the summary
as before. If the node should not print at all, delete `always_in_pdf` instead.
"""
