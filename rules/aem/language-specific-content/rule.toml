# The gate is the shape UBS writes by hand for content that differs between the language versions
# of a form: an Initialize script on `getFormMetadata().language` (AF Design Guidelines, 8.1.1;
# backlog "Language gating (V2)"). The writer writes it from `only_languages`; check.js holds that
# field to what the writer can gate, and a script a node LOADED from a deployed package carries to
# the shape UBS writes. Whether the content is kept once needs the language sources and is judged.
id = "ubs-aem-language-specific-content"
title = "Content only some languages have is kept once"
output_formats = ["aem-ubs"]
description = """
The language sources of a form do not always carry the same content: a paragraph, a field, an
option or a whole block can exist in one language version and not in another (CNV-TXT-4). Such
content is kept once: never dropped because one language lacks it, never built once per language.
Its texts in the languages that lack it carry the wording of a language that has it
(ubs-aem-text-languages-complete). A difference in wording of the same content is not
language-specific content, and neither is a paragraph another language covers with a different
split (ubs-aem-paragraphs).

It shows only in the languages whose source has it: set `only_languages` to those language codes
(as in `languages`; `es` also covers the platform's `sp`). The writer gives the node an Initialize
rule that reads `window.forms.ubs.getFormMetadata().language` and calls
`window.forms.ubs.showAFShowDor` or `hideAFHideDor`, so the Document of Record follows. Leave it empty
for content every language has. Only an input, a TextDraw, TitleDraw, MessageBox, HtmlDisplayer or a
Panel that no condition shows takes it; to gate anything else (a Repeatable, a Fragment, a block a
choice shows), wrap it in a Panel and gate that. The node is authored visible. Never write the
script yourself, and never into `passthrough`.

Reported: a code the form does not ship, every language listed, a node that cannot be gated, a
gated node authored hidden. A node loaded from a deployed package may still carry a hand-written
language script; it is reported when it breaks the shape UBS writes (not on `fd:init`, not one
SCRIPTMODEL with event `Initialize` naming its own node, no lower-casing, a language compared with
`==`, a code the form does not ship, Spanish tested under one code only, no `showAFShowDor` and
`hideAFHideDor`, more than one `fd:scripts` element, the node authored visible, or a node the writer
already writes visibility scripts for). Fix such a node by dropping its script and setting
`only_languages` instead.

How to judge: compare the language sources page by page (xfa_page_text of each language,
xfa_search_text for a distinctive phrase of one language in the others, xfa_render_pages where the
text alone is unclear). For each region one language has and another lacks, find its node
(json_search) and confirm it is there once, with every language's key written.
"""
