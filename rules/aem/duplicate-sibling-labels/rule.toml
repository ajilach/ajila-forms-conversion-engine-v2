id = "ubs-aem-duplicate-sibling-labels"
title = "Inputs side by side read differently"
output_formats = ["aem-ubs"]
description = """
Two inputs directly under the same parent must not carry the same label in the same language.
Nobody can tell them apart: not on screen, not in the summary, not in the Document of Record.
It happens when a group of uncaptioned source fields each gets the same stand-in (seven date
pickers all labelled "Date").

A group of uncaptioned source fields that each got the same stand-in is the usual cause: read the
column headings or the surrounding text of the source page (xfa_page_text, xfa_render_pages) and
give each input what it actually asks for.
"""
