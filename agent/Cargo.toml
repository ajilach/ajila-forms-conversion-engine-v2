[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { workspace = true }
regex-lite = { workspace = true }
tokio = { version = "1", features = ["process", "io-util", "rt", "time"] }
# The u2s tool servers, linked in-process (see u2s/VENDORED.md).
# rmcp3 names their result types; it is not a transport here.
rmcp3 = { package = "rmcp", version = "3.1", default-features = false }
tempfile = "3"
# `review::renders_blank`: reading a rendered page back to judge it.
image = { workspace = true }
# The reference store, its semantic matcher and the reference tools.
references-mcp = { path = "../references-mcp" }
u2s-aem-ubs-verify-mcp = { workspace = true }
u2s-aem-verify-core = { workspace = true }
u2s-blob = { workspace = true }
u2s-redacto-ubs-verify-mcp = { workspace = true }
u2s-redacto-verify-core = { workspace = true }
u2s-render-core = { workspace = true }
u2s-verify-core = { workspace = true }
u2s-render-pdf = { workspace = true }
u2s-render-pdf-mcp = { workspace = true }
u2s-render-xfa = { workspace = true }
u2s-render-xfa-mcp = { workspace = true }
u2s-xfa = { workspace = true }
u2s-xfa-mcp = { workspace = true }
# The UBS output formats, their document and rule tools, and the rule sandbox.
u2s-aem-ubs-mcp = { workspace = true }
u2s-redacto-ubs-mcp = { workspace = true }
u2s-mapper-redacto = { workspace = true }
u2s-doc-tools = { workspace = true }
u2s-jsondoc = { workspace = true }
u2s-rules-host = { workspace = true }
include_dir = "0.7"
# Reads a judged rule's rule.toml, which the vendored loader never sees.
toml = "0.8"

[build-dependencies]
# build.rs fetches the pinned pdfium build that src/pdfium.rs embeds.
flate2 = "1"
reqwest = { workspace = true, features = ["blocking"] }
sha2 = "0.10"
tar = "0.4"

[features]
# Un-gates `db::set_db_path_for_test` for another crate's own tests (this
# crate's tests always have it via `cfg(test)`) — `pipeline`'s tests need it
# to point `SqliteConversationMemory` at a scratch database instead of the
# real one in the developer's config directory.
test-utils = []

[dev-dependencies]
# The tool executor is async; the tests drive it directly.
tokio = { version = "1", features = ["macros", "rt"] }
# Runs a rule's check script directly, for the rule tests.
u2s-rules = { workspace = true }
# Opens a built package, to see what a rule's shape becomes in it.
zip = { workspace = true }
