[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blueprint = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "form"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
chrono = { workspace = true }
zip = { workspace = true }
regex-lite = { workspace = true }
# The Playwright MCP client: the agent spawns the browser server as a child
# process and speaks MCP to it over stdio.
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process"] }
# Spawn the browser server as a process-group leader (job object on Windows), so
# closing it takes the node process npx forks and its Chrome along.
process-wrap = { version = "9.1", default-features = false, features = ["tokio1", "process-group", "job-object"] }
tokio = { version = "1", features = ["process", "io-util", "rt", "time"] }
# The vendored u2s tool servers, linked in-process (see u2s/VENDORED.md).
# rmcp3 names their result types; it is not a transport here.
rmcp3 = { package = "rmcp", version = "3.1", default-features = false }
tempfile = "3"
u2s-render-core = { path = "../u2s/crates/u2s-render-core" }
u2s-render-pdf-mcp = { path = "../u2s/crates/u2s-render-pdf-mcp" }
u2s-render-xfa-mcp = { path = "../u2s/crates/u2s-render-xfa-mcp" }
u2s-xfa = { path = "../u2s/crates/u2s-xfa" }
u2s-xfa-mcp = { path = "../u2s/crates/u2s-xfa-mcp" }

[features]
# Un-gates `db::set_db_path_for_test` for another crate's own tests (this
# crate's tests always have it via `cfg(test)`) — `pipeline`'s tests need it
# to point `SqliteConversationMemory` at a scratch database instead of the
# real one in the developer's config directory.
test-utils = []

[dev-dependencies]
# The tool executor is async; the tests drive it directly.
tokio = { version = "1", features = ["macros", "rt"] }
# An in-process fake MCP server stands in for Playwright in the browser tests.
rmcp = { version = "1.7.0", default-features = false, features = ["client", "server", "transport-child-process"] }
# Proves the engine's Redacto dump is what the vendored verifier decodes.
u2s-mapper-redacto = { path = "../u2s/crates/u2s-mapper-redacto" }
