[package]
name = "u2s-xfa-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP stdio server exposing raw XFA data: packets, windowed reads, search, outline, node lookup"

[[bin]]
name = "u2s-xfa-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
env_logger = "0.11"
log = { workspace = true }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
serde_json = { workspace = true }
tokio = { workspace = true }
u2s-render-core = { path = "../u2s-render-core" }
u2s-xfa = { path = "../u2s-xfa" }

[dev-dependencies]
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
u2s-render-test-harness = { path = "../u2s-render-test-harness" }
