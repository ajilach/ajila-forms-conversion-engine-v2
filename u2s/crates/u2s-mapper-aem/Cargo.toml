[package]
name = "u2s-mapper-aem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The profile-agnostic AEM encoder: a mechanical mapper from a validated u2s-aem::ValidForm to a FileVault content package. No business logic -- naming, fragment choice and every other judgment call belong to the Conversion Agent and the rule engine, never to this crate."

[dependencies]
quick-xml = "0.36"
serde_json = { workspace = true }
thiserror = { workspace = true }
u2s-aem = { path = "../u2s-aem" }
# Deflate only, `default-features = false`: the default feature set writes
# per-entry timestamps, which makes package bytes non-reproducible and
# makes any golden-file comparison flap on every run.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Test-only, mirroring `u2s-aem`'s own `no_customer_terms.rs` genericity
# guard -- this crate's own is narrower in scope but the same mechanism.
regex = { workspace = true }
