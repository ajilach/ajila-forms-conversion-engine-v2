[package]
name = "u2s-render-pdf-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP stdio server exposing u2s-render-pdf"

[[bin]]
name = "u2s-render-pdf-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
env_logger = "0.11"
log = { workspace = true }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
serde_json = { workspace = true }
tokio = { workspace = true }
u2s-render-pdf = { path = "../u2s-render-pdf" }

[dev-dependencies]
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
u2s-render-test-harness = { path = "../u2s-render-test-harness" }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
