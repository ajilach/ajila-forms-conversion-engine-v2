[package]
name = "u2s-xfa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "XFA form parsing, layout and rasterization, ported from ajila-forms-conversion-engine"

[dependencies]
ab_glyph = "0.2.32"
# Embedded <image> payloads in a template are base64.
base64 = "0.22"
# Fidelity level 3: running the form's own init/calculate scripts.
boa_engine = { workspace = true }
image = { workspace = true }
imageproc = "0.26.0"
log = { workspace = true }
lopdf = "0.44"
quick-xml = "0.36"
rust_decimal = "1.40.0"
serde = { workspace = true }
thiserror = { workspace = true }
ttf-parser = "0.25"
whatlang = "0.16"

# `embed_all` is kept, contrary to the plan's intent to trim it: hyphenation
# 0.8.4 offers only `embed_all` and `embed_en-us`, with no per-language German
# feature. German drives layout on the UBS corpus — hyphenation changes wrap
# points, which change heights, which change page breaks — so dropping it would
# change rendering, not just binary size.
hyphenation = { version = "0.8.4", features = ["embed_all"] }

# regex-lite serves two call sites: font_manager::parse_unicode_range and the
# scripting object model.
regex-lite = "0.1"

# XML text can arrive as a combining-character decomposition (e.g. "a" +
# U+0300 for "à") even when the embedded font only has the precomposed glyph.
# Normalising to NFC once at the parser edge means every downstream consumer
# (layout, rendering, text extraction) sees the same composed form.
unicode-normalization = "0.1"
