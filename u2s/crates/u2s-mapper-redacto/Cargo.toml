[package]
name = "u2s-mapper-redacto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The profile-agnostic Redacto encoder: a mechanical mapper from a validated u2s-redacto::ValidDocument to the platform's own INSERT script. No business logic -- naming and every other judgment call belong to the Conversion Agent and the rule engine, never to this crate."

[dependencies]
serde = { workspace = true }
