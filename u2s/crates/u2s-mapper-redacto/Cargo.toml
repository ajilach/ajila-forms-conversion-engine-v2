u2s-redacto = { path = "../u2s-redacto" }
uuid = { workspace = true }

[dev-dependencies]
# Test-only, mirroring `u2s-aem`'s own `no_customer_terms.rs` genericity
# guard -- this crate's own is narrower in scope but the same mechanism.
regex = { workspace = true }
