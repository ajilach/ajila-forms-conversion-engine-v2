[package]
name = "u2s-verify-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Format-agnostic verification runtime: Docker container lifecycle and a CDP browser driver, plus the report shape the verify capability's `verify_run` tool returns. No output-format vocabulary lives here -- see u2s-aem-verify-core for the AEM-specific flow built on top."

[dependencies]
base64 = "0.22"
bollard = { workspace = true }
chromiumoxide = { workspace = true }
futures = { workspace = true }
# Readiness polling only (`wait_for_http`) -- the AEM/Package-Manager HTTP
# client itself is `u2s-aem-verify-core`'s, since its request shapes are
# format-specific. `rustls-tls` matches `u2s-auth`'s own choice so a build
# never links both a rustls and a native-tls backend.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
u2s-blob = { path = "../u2s-blob" }
