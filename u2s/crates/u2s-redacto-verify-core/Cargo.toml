[package]
name = "u2s-redacto-verify-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Redacto verification runtime shared by every Redacto-verifying MCP server, built on u2s-verify-core: a throwaway (or session-reused) Postgres import of a real dump, plus an optional render call against an already-running Redacto platform. Format-specific behaviour is a RenderProfile the binary on top supplies."

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
u2s-blob = { path = "../u2s-blob" }
u2s-mapper-redacto = { path = "../u2s-mapper-redacto" }
u2s-redacto = { path = "../u2s-redacto" }
u2s-verify-core = { path = "../u2s-verify-core" }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
