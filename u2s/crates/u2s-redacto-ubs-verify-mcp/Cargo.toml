[package]
name = "u2s-redacto-ubs-verify-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP stdio server verifying a redacto-ubs dump against a real Postgres schema (and, when a rendering endpoint is configured, an already-running Redacto platform) -- offered to the Output Review Agent alone via the side-effecting verify capability."

[[bin]]
name = "u2s-redacto-ubs-verify-mcp"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
rmcp = { version = "3.1", features = ["server", "transport-io"] }
semver = "1"
serde_json = { workspace = true }
tokio = { workspace = true }
u2s-blob = { path = "../u2s-blob" }
u2s-redacto-verify-core = { path = "../u2s-redacto-verify-core" }
u2s-verify-core = { path = "../u2s-verify-core" }

[dev-dependencies]
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
u2s-mcp = { path = "../u2s-mcp" }
u2s-render-test-harness = { path = "../u2s-render-test-harness" }
