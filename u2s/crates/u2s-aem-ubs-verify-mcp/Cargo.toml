[package]
name = "u2s-aem-ubs-verify-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP stdio server verifying an AEM Adaptive Forms package against a real AEM instance running UBS's own `ajila-forms-ubs` platform: opens the form with the `mandator`/`afAcceptLang` query parameters that platform requires, walks its wizard, and submits through UBS's own `window.forms.ubs.navigation.submit(...)` routine (raw `guideBridge.submit()` would take AEM's native XDP rendering path, unavailable in this workspace's own ARM Docker image) so the Redacto rendering dependency actually produces the submitted PDF."

[[bin]]
name = "u2s-aem-ubs-verify-mcp"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
rmcp = { version = "3.1", features = ["server", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
u2s-aem-verify-core = { path = "../u2s-aem-verify-core" }
# Only `jcr::tree` is reused from here: the same JCR-XML attribute parser
# the decoder uses, so this crate's own metadata extraction (a UBS form's
# authored mandator/language entities) is derived with the one parser this
# workspace already trusts, not a second hand-rolled one.
u2s-mapper-aem = { path = "../u2s-mapper-aem" }

[dev-dependencies]
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
u2s-mcp = { path = "../u2s-mcp" }
u2s-render-test-harness = { path = "../u2s-render-test-harness" }
zip = { version = "2", default-features = false, features = ["deflate"] }
