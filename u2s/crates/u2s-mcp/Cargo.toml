[package]
name = "u2s-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The extension mechanism: MCP client pool, manifest parsing, format-scoped resolution, conformance"

[dependencies]
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
semver = "1"
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "sync", "time", "rt-multi-thread", "macros"] }
tracing = { workspace = true }
u2s-core = { path = "../u2s-core" }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
u2s-render-test-harness = { path = "../u2s-render-test-harness" }
