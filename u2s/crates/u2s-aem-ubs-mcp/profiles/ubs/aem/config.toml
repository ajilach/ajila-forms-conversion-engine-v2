# =============================================================================
# UBS AEM Forms Output Profile
# =============================================================================
#
# Profile directory for UBS-specific AEM output.
# Use with:  blueprint --aem profiles/ubs/aem input/AAAI_019_DE.pdf
#
# Template syntax: Tera (Jinja2-style)
#   Namespaces:
#     xfa.*        — raw XFA <variables><text> from the PDF
#     variables.*  — user-defined intermediate values (below)
#   Runtime vars (available in *.xml templates):
#     author           — authoring user name
#     master_language  — primary language code (from profile)
#     languages        — comma-separated list of detected languages
#     expanded_languages — languages including synonyms, comma-separated

title = "{{ xfa.formrange_code }}"

master_language = "en"

# Where the schema lives when a package binds to one. Always set, because it is
# what lets a bound package be built on demand; the DAM metadata only advertises
# it when `bind_to_xsd` is on, so the default package is unaffected.
xsd_path = "/content/dam/formsanddocuments/afforms_xsd/AFForms/AF_{{ variables.form_code }}.xsd"

# Off by default: the plain "AEM package" download carries no bindRefs and no
# schema. The "AEM package with bindRefs" download flips this on, which bundles
# the XSD and binds every field to it.
bind_to_xsd = false

use_fragments = true
fragment_xsd_ref = "/content/dam/formsanddocuments/afforms_xsd/"
fragment_ref_prefix = "/content/dam/formsanddocuments/"

# Conditional fragment libraries based on formrange entity.
# Paths are relative to fragments/ and can be:
# - A fragment library directory (scanned recursively): "afforms_ubs_fragmentlib"
# - A specific fragment: "afforms_ubs_fragmentlib/affrg_Address1"
fragment_paths = "afforms_ubs_fragmentlib"

form_path = "{{ variables.entity_dir }}/{{ variables.prefix_dir }}"

form_dir = "AF_{{ xfa.formrange_code }}"

# =============================================================================
# Variables — reusable intermediate values
# =============================================================================
[variables]
entity_dir = """{% if xfa.formrange_entity == "019" %}afforms_germany_all{% elif xfa.formrange_entity == "033" %}afforms_italy_all{% elif xfa.formrange_entity == "001" %}afforms_ch_all{% else %}afforms_global_all{% endif %}"""
prefix_dir = "af_{{ xfa.formrange_code | truncate(length=2, end='') | lower }}"

# Summary component toggle — set to "true" to enable the summary component
# on the preview panel (replaces carousel preview) and add redactoSummary
# metadata to the DAM asset.
use_summary = "true"

# Form identity
form_code = "{{ xfa.formrange_code }}"

# Paths
template_path = "/conf/ajila-forms-ubs/settings/wcm/templates/basic"
page_resource_type = "/apps/ajila-forms-customers/ajila-forms-ubs/components/pages/aftemplatedpage"
theme_ref = "/content/dam/formsanddocuments-themes/ajila-forms-ubs/standard-theme"
redirect_url = "/content/forms/af/afforms_global_common/confirm-successful-submission"
meta_template_ref = """/content/dam/formsanddocuments/reference-dor-templates/ajila-forms-ubs/02_forms/{% if xfa.formrange_entity == "019" %}UBS_General_Germany_DOR.xdp{% elif xfa.formrange_entity == "033" %}UBS_General_Italy_DOR.xdp{% else %}UBS_Blank_DoR.xdp{% endif %}"""
dor_template_ref = "/content/dam/formsanddocuments/{{ variables.entity_dir }}/{{ variables.prefix_dir }}/AF_{{ xfa.formrange_code }}/jcr:content/renditions/dorTemplate"

# Component resource types
resource_type_base = "fd/af/components"
custom_resource_type_base = "ajila-forms-customers/ajila-forms-ubs/components"
action_type = "ajila-forms-customers/ajila-forms-ubs/components/actions/submit"
client_lib_ref = "ajila-forms-ubs"
wizard_layout = "ajila-forms-customers/ajila-forms-ubs/layouts/panel/wizard"
default_layout = "fd/af/layouts/gridFluidLayout2"

# DOR settings
form_type = " "
dor_field_styling = "Default"
dor_type = "generate"

# Per-component CSS classes
css_textbox = "widget_ajila-forms-ubs-textbox"
css_numericbox = "widget_ajila-forms-ubs-numericbox"
css_datepicker = "widget_ajila_forms_datepicker"
css_checkbox = "widget_ajila_forms_checkbox"
css_radiobutton = "widget_ajila_forms_radiobutton"
css_dropdownlist = "widget_ajila_forms_dropdownlist"
css_primarybutton = "widget_ajila-forms-ubs-primarybutton"
css_textbox_multiline = "widget_ajila-forms-ubs-textbox ubs-textbox-multiline"
css_telephone = "widget_ajila-forms-ubs-phonebox"
# The UBS HTML component (a table, a chart, an image rendered from markup).
css_htmldisplayer = "widget_ajila_forms_htmlViewer"

# Email / telephone validation, vendored from the deployed corpus (feedback #117,
# PROBLEM-email-phone-component) rather than invented here: 63 hand-authored
# instances across 26 forms agree on these, and they are what AEM already
# validates against. The clauses are stored XML-attribute-escaped (`&lt;`,
# `&quot;`), the form they are written in inside a JCR property.
#
# The message is the ENGLISH master. It is also a `[translations]` key in
# `translations/*.toml`, so each form's per-locale dictionary carries the
# translated wording under `fd_<master>` and AEM renders the message in the
# reader's language. Change the string here and you must change that key too, or
# the translation stops resolving.
email_validate_clause = '^(([^&lt;>()\\[\\]\\\\.,;:\\s@&quot;]+(\\.[^&lt;>()\\[\\]\\\\.,;:\\s@&quot;]+)*)|(&quot;.+&quot;))@((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}])|(([a-zA-Z\\-0-9]+\\.)+[a-zA-Z]{2,}))$'
email_validate_message = "Please enter a valid email address (e.g., max.muster@beispiel.ch)."

# `{0,20}` is the corpus majority (29 of 31 deployed telephones); the two
# `{0,14}` variants are deliberate exceptions on existing forms and are left
# alone by the sweep rather than widened.
tel_validate_clause = '^([+]|00)[0-9]{0,20}$'
tel_validate_message = "Please enter a valid phone number incl. country code (e.g., +41)."

# ── Fragment-panel Initialize rules ──────────────────────────────────────────
# Full `fd:init` attribute values, kept here rather than inline in the templates
# because more than one template emits the same rule: the banking-relationship
# panel is written by `preface.xml` on the from-XFA path and by `fragment.xml`
# when a loaded package carries it as a fragment node. One string, one place to
# change it.
#
# AEM's Expression Editor hands back exactly ONE SCRIPTMODEL per field+event
# pair. Two or more sharing `this`+`Initialize` are concatenated with a bare
# comma into invalid JSON, and the Editor then throws client-side the moment it
# loads that field — taking the whole page's editor data with it. So each value
# below is a SINGLE entry, however many statements it carries.

# Address fragments (feedback #102): City and Country must be optional. The
# fragment's own default makes them mandatory — a static attribute and/or its own
# `setMandatory(this, true)` — so this overrides it defensively. Both fields sit
# one level down in `PN_AddressBlock` and are passed as function ARGUMENTS, which
# is why they need the `this.` prefix: a bare or merely panel-qualified reference
# does not resolve (three successive corpus rollouts shipped broken on exactly
# that).
address_init = '''[{&quot;script&quot;:{&quot;field&quot;:&quot;this&quot;\,&quot;event&quot;:&quot;Initialize&quot;\,&quot;model&quot;:{&quot;nodeName&quot;:&quot;EVENT_SCRIPTS&quot;}\,&quot;content&quot;:&quot;window.com.ajila.forms.ubs.components.setMandatory(this.PN_AddressBlock.TXT_City_AddressBlock\, false);\\nwindow.com.ajila.forms.ubs.components.setMandatory(this.PN_AddressBlock.DD_Country_AddressBlock\, false);&quot;}\,&quot;nodeName&quot;:&quot;SCRIPTMODEL&quot;\,&quot;version&quot;:1\,&quot;enabled&quot;:true}]'''

# `affrg_AddressGeneric1` already carried two Initialize entries of its own —
# the hide/DoR calls and the country list. They are folded in here, not
# appended as a second entry.
address_generic_init = '''[{&quot;script&quot;:{&quot;field&quot;:&quot;this&quot;\,&quot;event&quot;:&quot;Initialize&quot;\,&quot;model&quot;:{&quot;nodeName&quot;:&quot;EVENT_SCRIPTS&quot;}\,&quot;content&quot;:&quot;window.forms.ubs.hideAFHideDor(TXT_StreetNumber);\\nwindow.forms.ubs.hideAFHideDor(TXT_AdditionalDetails_AddressBlock);\\nwindow.forms.ubs.hideAFHideDor(TXT_PostalCodeCity);\\nwindow.forms.ubs.hideAFHideDor(TXT_State_AddressBlock);\\nwindow.forms.ubs.hideAFHideDor(TXT_District_AddressBlock_APAC);\\nvar formMetadata = window.forms.ubs.getFormMetadata();\\nwindow.forms.ubs.referencedata.getCountryList(formMetadata.mandator\, formMetadata.language\, 'DOMICILE_INDIVIDUAL'\, DD_Country_AddressBlock);\\nwindow.com.ajila.forms.ubs.components.setMandatory(this.PN_AddressBlock.TXT_City_AddressBlock\, false);\\nwindow.com.ajila.forms.ubs.components.setMandatory(this.PN_AddressBlock.DD_Country_AddressBlock\, false);&quot;}\,&quot;nodeName&quot;:&quot;SCRIPTMODEL&quot;\,&quot;version&quot;:1\,&quot;enabled&quot;:true}]'''

# Germany only (feedback #104): the banking-relationship field defaults to
# `0319` and renders disabled. Italy and every other entity share the same
# canonical fragment but keep whatever they have, so the templates gate this on
# the entity, not on the fragment.
banking_default_de_init = '''[{&quot;script&quot;:{&quot;field&quot;:&quot;this&quot;\,&quot;event&quot;:&quot;Initialize&quot;\,&quot;model&quot;:{&quot;nodeName&quot;:&quot;EVENT_SCRIPTS&quot;}\,&quot;content&quot;:&quot;TXT_BankingRelationship1.value = '0319';\\nTXT_BankingRelationship1.enabled = false;&quot;}\,&quot;nodeName&quot;:&quot;SCRIPTMODEL&quot;\,&quot;version&quot;:1\,&quot;enabled&quot;:true}]'''

# The language the metadata control reports as the form's master -- the issuing
# region's own language: Germany's forms are written in German, Italy's in
# Italian, everywhere else English. This is NOT `master_language` above: that is
# the language the dictionaries are keyed in (English), which stays English for a
# German form. `root.xml` overrides this with the form's own language when it
# ships only one, and falls back to EN when the region's language is not among
# the languages the form ships.
metadata_master_language = "{% set entity = xfa.formrange_entity | default(value='') %}{% if entity == '019' %}DE{% elif entity == '033' %}IT{% else %}EN{% endif %}"

# The form configurator ships with an option already selected: only this one
# choice has a right answer before the reader gives one, and nearly every form is
# filled in for an individual, so UBS asked for it to open that way
# (PROBLEM-formconfig-private-person-default). No setting here any more — the
# choice is recognised by its option labels and the option's own key is written,
# because both the field name and the key differ per form and per market.

# =============================================================================
# Add-button wording
# =============================================================================
# A repeatable's Add button has to name what it adds ("Add client", not "Add"),
# and the word order differs per language, so the phrasing lives here rather than
# in the template. `{subject}` is the block's own title, or the heading above it.
# A language with no pattern gets no label: the button keeps the bare template
# text rather than a sentence in the wrong word order.
[add_label_patterns]
en = "Add {subject}"
de = "{subject} hinzufügen"
fr = "Ajouter {subject}"
it = "Aggiungere {subject}"
sp = "Añadir {subject}"

# =============================================================================
# Language Synonyms
# =============================================================================
[language_synonyms]
de = ["de-ch"]
sp = ["es"]

# =============================================================================
# HTML-component locales
# =============================================================================
# The HTML component (`controls/htmlDisplayer`) does not read the Sling i18n
# dictionary. It carries one `localeContent` item per locale and matches the
# reader's locale against those, so the engine has to know which spelling the
# deployed component matches on -- and that is a property of the component, not
# of this engine.
#
# These are the engine's own short codes, which is what the owner asked for. The
# UBS locale set is spelled regionally in the design guidelines
# (specs/AF Design Guidelines (Summary).md: de-ch, en-us, en-gb, fr-ch, it-ch)
# and the AEM authoring UI wrote `en-us` / `it-ch` into the reference node in
# AAOV_033, so if a converted form shows a BLANK block for a language, the
# component is matching regionally: swap the right-hand column for
# en = "en-us", de = "de-ch", fr = "fr-ch", it = "it-ch", sp = "es-es".
#
# A language absent from this table keeps its own code.
[html_locales]
en = "en"
de = "de"
de-ch = "de-ch"
fr = "fr"
it = "it"
sp = "sp"
es = "es"

# =============================================================================
# Custom Elements — regex-based element replacement with custom templates
# =============================================================================
[[custom_elements]]
field_name = "(?i)^Tipo$"
template = "tipo_radio"
depends_on = ["account_holder_it", "signatures_it"]

[[custom_elements]]
field_name = "^(Formular Adressat|Form addressee)$"
template = "formular_adressat_radio"
depends_on = ["account_holder", "signatures"]

# account_holder cross-references panels produced by `signatures` (the Add
# buttons pair each partner panel with its signature panel: PN_CPGRP with
# PN_SGN_CPGRP, PN_AHGRP with PN_Sign_AHGRP, PN_AHGRP_AR with
# PN_Sign_AHGRP_AR) and reads `RB_FormularAdressat` from
# `formular_adressat_radio` in its visibility rules, so both must also be
# present in the form.
# Matches German (and English-mirrored) forms only; the Italian variant lives
# in `account_holder_it`.
[[custom_elements]]
field_name = '^Kundendaten$'
template = "account_holder"
page = 0
depends_on = ["signatures", "formular_adressat_radio"]
# Most addressee-driven forms never head this section at all -- AABF_019 calls
# its partner the ordering customer and gives it no heading of its own. The
# configurator is what makes the form addressee-driven, so the block is placed
# on the configurator's own step when no section matches.
inject = "append"

# signatures' three conditional containers use `RB_FormularAdressat` in their
# visibility rules, so `formular_adressat_radio` must also be present.
# Italian forms use `signatures_it` instead.
[[custom_elements]]
field_name = '^(Signature\(s\)|Unterschrift\(en\))$'
template = "signatures"
page = -1
depends_on = ["formular_adressat_radio", "account_holder"]
# Signatures are their own wizard step, so an unheaded form gets one appended.
inject = "step"

# Italian variant of account_holder: visibility/scripts reference
# `RB_GroupTipo` (Individual=1, Legal entity=2) and cross-reference
# `PN_SGN_CPGRP` / `PN_Sign_AHGRP` from `signatures_it`.
[[custom_elements]]
field_name = '(?i)^\s*Dati\s+del/i\s+cliente/i\s*(?:\(.*\))?\s*$'
template = "account_holder_it"
page = 0
depends_on = ["signatures_it", "tipo_radio"]
# Same reason as the German variant: AAOV_033 heads this section "Titolare del
# conto", not "Dati del/i cliente/i", and the whole cycle used to drop with it.
inject = "append"

# Italian variant of signatures: two conditional containers driven by
# `RB_GroupTipo` from `tipo_radio` (no Minor branch).
[[custom_elements]]
field_name = '^Firma/e$'
template = "signatures_it"
page = -1
depends_on = ["tipo_radio", "account_holder_it"]
inject = "step"
