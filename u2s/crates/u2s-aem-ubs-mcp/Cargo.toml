[package]
name = "u2s-aem-ubs-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The UBS AEM output format: the MCP stdio server for aem-ubs, and the library with the UBS document, its encoder through the UBS templates into a FileVault package, its decoder, and the UBS check rules"

[[bin]]
name = "u2s-aem-ubs-mcp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
boa_engine = { workspace = true }
env_logger = "0.11"
include_dir = "0.7"
log = { workspace = true }
quick-xml = "0.36"
regex-lite = "0.1"
rust_decimal = "1.40"
schemars = { workspace = true, features = ["uuid1"] }
serde = { workspace = true }
tera = "1"
thiserror = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
semver = "1"
serde_json = { workspace = true }
tokio = { workspace = true }
# The ONLY crate that may name an AEM type. `u2s-server` never links this
# binary -- it registers it at runtime and reads its schema back as JSON --
# which is exactly what keeps `tests/genericity.rs` green while the core
# stays format-agnostic.
u2s-aem = { path = "../u2s-aem" }
# The mechanical encoder + the fragment-library scan/search logic. Kept as
# a separate library crate rather than inlined here so it stays testable
# without an MCP harness -- the "library has the logic, binary is thin"
# split every other u2s server already follows.
u2s-mapper-aem = { path = "../u2s-mapper-aem" }
u2s-blob = { path = "../u2s-blob" }

[dev-dependencies]
u2s-doc-tools = { path = "../u2s-doc-tools" }
u2s-rules = { path = "../u2s-rules" }
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
u2s-mcp = { path = "../u2s-mcp" }
u2s-render-test-harness = { path = "../u2s-render-test-harness" }
zip = { version = "2", default-features = false, features = ["deflate"] }
