[package]
name = "u2s-render-xfa-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP stdio server exposing u2s-render-xfa"

[[bin]]
name = "u2s-render-xfa-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
env_logger = "0.11"
log = { workspace = true }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
serde_json = { workspace = true }
tokio = { workspace = true }
u2s-render-xfa = { path = "../u2s-render-xfa" }

[dev-dependencies]
image = { workspace = true }
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
u2s-render-test-harness = { path = "../u2s-render-test-harness" }
# dev-only: the vendored UBS corpus resolver (`u2s_xfa::corpus`) and font
# bootstrap (`u2s_xfa::fonts::test_support`), already a transitive dependency
# via `u2s-render-xfa`.
u2s-xfa = { path = "../u2s-xfa" }
