[package]
name = "runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agent = { path = "../agent" }
pipeline = { path = "../pipeline" }
base64 = { workspace = true }
# Local timestamps in the run-analysis files.
chrono = { workspace = true }
# The default run-analysis folder, under the config directory.
dirs = { workspace = true }
futures-util = "0.3"
image = { workspace = true }
reqwest = { workspace = true }
rig-core = { workspace = true }
rig-agent = { workspace = true }
# `TokenWindowMemory`, wrapping our own calibrated `TokenCounter`; see
# `runner::token_counter`.
rig-memory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `spawn_blocking` for request preparation; the runtime itself is the caller's.
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
# Scripted models, so the run-analysis test drives a real pipeline run with no
# network.
rig-core = { workspace = true, features = ["test-utils"] }
# The controller builds the document before every review, so the run-analysis
# test's agent needs a buildable document and the evidence gate waived.
agent = { path = "../agent", features = ["test-utils"] }
# The transport is async and is tested end to end against a local socket.
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
