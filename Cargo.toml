[workspace]
members = [
    "core",
    "cli",
    "app",
    "agent",
    "mcp",
    "pipeline",
    "runner",
    "judge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor CI pins and the version edition-2024 plus let-chains need.
rust-version = "1.88"
repository = "https://github.com/ajilach/ajila-forms-conversion-engine"

# Versions for every dependency more than one crate uses, so they cannot drift
# apart the way reqwest did (0.12 in one crate, 0.13 in two others, two HTTP and
# TLS stacks in one lockfile). Crate-specific dependencies stay in their own
# manifest.
[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
env_logger = "0.11"
image = { version = "0.25", features = ["png", "jpeg"] }
log = "0.4"
rayon = "1.10"
regex-lite = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
# Pinned exactly: rig is pre-1.0 and ships breaking changes between minors, so an
# upgrade is deliberate work rather than a `cargo update`.
# Only the two crates we use: `rig-core` for the providers, messages and
# streaming, `rig-agent` for the sans-IO `AgentRun` loop. The `rig` facade
# would drag in the vector-store integrations (lancedb, milvus, fastembed) and
# with them a second reqwest/TLS stack.
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.42.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
