[workspace]
members = [
    "cli",
    "app",
    "agent",
    "pipeline",
    "references-mcp",
    "runner",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor CI pins: edition 2024 and let-chains need 1.88, `File::try_lock`
# (the verifier's cross-process lock) needs 1.89.
rust-version = "1.89"
repository = "https://github.com/ajilach/ajila-forms-conversion-engine"

# Versions for every dependency more than one crate uses, so they cannot drift
# apart the way reqwest did (0.12 in one crate, 0.13 in two others, two HTTP and
# TLS stacks in one lockfile). Crate-specific dependencies stay in their own
# manifest.
[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
env_logger = "0.11"
image = { version = "0.25", features = ["png", "jpeg"] }
log = "0.4"
regex-lite = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
# Pinned exactly: rig is pre-1.0 and ships breaking changes between minors, so an
# upgrade is deliberate work rather than a `cargo update`.
# The three crates we use: `rig-core` for the providers, messages and
# streaming, `rig-agent` for the sans-IO `AgentRun` loop, `rig-memory` for the
# conversation-memory policies (sliding/token window, compaction) our own
# context budget is built on. The `rig` facade would drag in the vector-store
# integrations (lancedb, milvus, fastembed) and with them a second
# reqwest/TLS stack.
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.42.0", default-features = false }
rig-memory = { version = "=0.42.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Pinned exactly upstream: its query_parameters/model split is not stable across minors.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# The u2s crates, from ajila-forms-conversion-engine-v3 at one revision, vendored
# into vendor/crates (see u2s/VENDORED.md). Bump with scripts/sync-u2s.sh, which
# changes this rev and re-vendors.
u2s-aem-ubs-mcp = { git = "ssh://git@github.com/ajilach/ajila-forms-conversion-engine-v3.git", rev = "5827daa51d23dc1becf71c50826fd5870e22b01f" }
