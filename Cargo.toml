[workspace]
members = [
    "cli",
    "app",
    "agent",
    "pipeline",
    "references-mcp",
    "runner",
    # Vendored from ajila-forms-conversion-engine-v3, see u2s/VENDORED.md.
    "u2s/crates/u2s-aem",
    "u2s/crates/u2s-aem-ubs-mcp",
    "u2s/crates/u2s-aem-ubs-verify-mcp",
    "u2s/crates/u2s-aem-verify-core",
    "u2s/crates/u2s-blob",
    "u2s/crates/u2s-core",
    "u2s/crates/u2s-doc-tools",
    "u2s/crates/u2s-facts",
    "u2s/crates/u2s-jsondoc",
    "u2s/crates/u2s-mapper-aem",
    "u2s/crates/u2s-mapper-redacto",
    "u2s/crates/u2s-mcp",
    "u2s/crates/u2s-redacto",
    "u2s/crates/u2s-redacto-ubs-mcp",
    "u2s/crates/u2s-redacto-ubs-verify-mcp",
    "u2s/crates/u2s-redacto-verify-core",
    "u2s/crates/u2s-render-core",
    "u2s/crates/u2s-render-pdf",
    "u2s/crates/u2s-render-pdf-mcp",
    "u2s/crates/u2s-render-test-harness",
    "u2s/crates/u2s-render-xfa",
    "u2s/crates/u2s-render-xfa-mcp",
    "u2s/crates/u2s-rules",
    "u2s/crates/u2s-rules-host",
    "u2s/crates/u2s-schema",
    "u2s/crates/u2s-verify-core",
    "u2s/crates/u2s-xfa",
    "u2s/crates/u2s-xfa-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor CI pins: edition 2024 and let-chains need 1.88, `File::try_lock`
# (the verifier's cross-process lock) needs 1.89.
rust-version = "1.89"
repository = "https://github.com/ajilach/ajila-forms-conversion-engine"

# Versions for every dependency more than one crate uses, so they cannot drift
# apart the way reqwest did (0.12 in one crate, 0.13 in two others, two HTTP and
# TLS stacks in one lockfile). Crate-specific dependencies stay in their own
# manifest.
[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
env_logger = "0.11"
image = { version = "0.25", features = ["png", "jpeg"] }
log = "0.4"
rayon = "1.10"
regex-lite = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
# Pinned exactly: rig is pre-1.0 and ships breaking changes between minors, so an
# upgrade is deliberate work rather than a `cargo update`.
# The three crates we use: `rig-core` for the providers, messages and
# streaming, `rig-agent` for the sans-IO `AgentRun` loop, `rig-memory` for the
# conversation-memory policies (sliding/token window, compaction) our own
# context budget is built on. The `rig` facade would drag in the vector-store
# integrations (lancedb, milvus, fastembed) and with them a second
# reqwest/TLS stack.
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.42.0", default-features = false }
rig-memory = { version = "=0.42.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Only the vendored u2s crates inherit these; versions and pins follow upstream's
# own workspace manifest so the vendored Cargo.toml files stay unchanged.
anyhow = "1"
boa_engine = "0.20"
# Pinned exactly upstream: its query_parameters/model split is not stable across minors.
bollard = "0.21.1"
# Pinned exactly upstream: its CDP types are generated and shift between minors.
chromiumoxide = "0.9.1"
futures = "0.3"
jsonschema = { version = "0.30", default-features = false }
regex = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
